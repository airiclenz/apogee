clip: tiny
ship: tiny.gif
cassette: tiny.cassette
fonts: ../../../graphics/demo/fonts
frame: {cols: 80, rows: 24, padding: 16, font_size: 14, line_height: 1.2, scale: 2, width: 600, fps: 24, max_colors: 128}
expect: {stage: dirty}
beats:
  - id: 1
    title: open
    why: the first paint
    do:
      - wait: {screen: "Auto|Plan", timeout: 20s}
    duration: 2s
  - id: 2
    title: mode click
    do:
      - click: {target: {text: "Auto", nth: first, area: footer}, times: 2}
      - pause: {for: 300ms}
    duration: 3s
    hold: 3s
    zoom: {target: {text: "ctx \\d+%", nth: last, area: status}, factor: 1.5, in: 200ms, out: 200ms}
  - id: 3
    title: prompt
    do:
      - type: {text: "tests are failing"}
      - type: {text: "/", humanize: false}
      - key: {name: enter, repeat: 2}
      - wait: {screen: "Tests", gone: true, timeout: 3m}
    duration: 4s
    expect: [{entry: {kind: toolCall, tool: Tests, nth: last}, contains: PASS, after: 2}]
  - id: 4
    title: dropped
    do:
      - pause: {for: 1s}
    cut: true
