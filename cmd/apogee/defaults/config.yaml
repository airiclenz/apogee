# apogee configuration — ~/.apogee/config.yaml
#
# This file is created automatically on first run from a template compiled into the
# apogee binary. Your edits are preserved: apogee never overwrites an existing config.
#
# Settings resolve by precedence, highest first:
#
#   command-line flag  >  APOGEE_* environment variable  >  this file  >  built-in default
#
# Every line below is commented out with ONE exception — system-prompt-text:, the default
# system prompt — so out of the box this file changes nothing else; it is a documented
# starting point. Uncomment a line and edit it to make it your default; delete or comment
# out the system prompt to send none.

# =============================================================================
# The local OpenAI-compatible LLM server URL.
#   flag: --endpoint   env: APOGEE_ENDPOINT
# endpoint: http://192.168.64.1:1111

# =============================================================================
# The bearer token that endpoint wants, if it wants one — llama.cpp started with --api-key,
# LM Studio, a remote vLLM, any keyed OpenAI-compatible proxy. It is sent as
# `Authorization: Bearer <key>` on EVERY request to the server above: your conversation, the
# ten-second heartbeat, and both halves of `apogee probe`. Leave it unset — the local-server
# default — and no Authorization header is sent at all.
#   env: APOGEE_API_KEY   (no flag, deliberately: a secret typed on the command line lands in
#                          your shell history and in `ps` output on every OS)
# The environment variable WINS over this file, so a key here is your per-machine default and
# APOGEE_API_KEY is the override. CAVEAT: this file is plain text — on a shared machine prefer
# the environment variable, or restrict this file's permissions yourself. apogee reports
# whether a key was resolved (`apogee probe`, the upstream block); the value is never printed,
# and the provider client redacts it from server-echoed errors.
# api-key: sk-my-server-token

# =============================================================================
# A short, friendly name for the upstream host, shown in the status footer. Leave it unset
# and apogee shows the endpoint's host instead. Config-file only (no flag or env).
# host-alias: my-box

# The model name to request from that server. It is a HINT, not a claim: apogee follows the
# model the server actually serves. Leave it unset and the first heartbeat binds whatever is
# loaded — a single-model server (e.g. llama.cpp's llama-server) needs only the endpoint above
# — and set it on a multi-model server to say which of them you mean. Either way, when the
# server's loaded model changes under a running session, apogee rebinds to it within ten
# seconds and says so in the transcript.
#   flag: --model      env: APOGEE_MODEL
# model: qwen2.5-coder

# =============================================================================
# The OTHER servers you run models on. endpoint: above is where a session STARTS; each entry
# here is a server the running session can be moved to with /server, without restarting apogee
# and without losing the conversation. Config-file only (no flag or env). Default: empty — no
# alternatives are offered, and nothing else changes.
#
#   name       what the entry is called: the label /server lists it under, the argument
#              `/server <name>` takes, and the host name the status footer shows once the
#              session is on it (host-alias: above, once per server). Required, and no two
#              entries may share one.
#   endpoint   that server's OpenAI-compatible URL, like the endpoint: above. Required.
#   api-key    the bearer token that server wants, if it wants one. Optional, and config-file
#              only: APOGEE_API_KEY is a single value and it belongs to the STARTUP server, so
#              a keyed server here carries its own key. Leave it out for a keyless local one.
#   model      that server's model hint — exactly the model: above, per server: which of the
#              models it serves you mean. Optional: leave it out and the first heartbeat there
#              binds whatever is loaded.
#
# The server this session started on is always offered too, whether or not you list it here, so
# you can always switch back. A switch lasts for the SESSION only: nothing is written back to
# this file, and the next launch starts at endpoint: above again.
#
# servers:
#   - name: workstation
#     endpoint: http://192.168.64.1:1111
#     model: gpt-oss-20b
#   - name: rented-box
#     endpoint: https://llm.example.com
#     api-key: sk-rented-token

# =============================================================================
# Start, switch and stop the LOCAL servers yourself, with llama-launcher. The servers: list above
# says where a session may MOVE to; this says apogee may also bring one up: with a launcher
# configured /model offers the launcher's launch profiles instead of what the server advertises and
# waits while the one you pick starts, /unload-model frees the model of that server and
# /stop-server stops it. All three are ordinary rows in the / menu. Config-file only (no flag or
# env). Three values:
#
#   (unset)   auto-detect — apogee reads llama-launcher's own default config,
#             ~/.config/llama-launcher/config.yaml, if that file is there. If it is not, /model
#             lists what the server advertises, as it always did, and /unload-model and
#             /stop-server answer "llama-launcher not configured" when you reach for one. This is
#             the default, and on a machine with the launcher installed it needs no configuration.
#   off       leave the local-server commands off, even on a machine that has a launcher config.
#   <path>    read THIS launcher config instead of the default one (~ expands).
#
# Nothing is checked at startup: a path that is not there is reported the first time a command
# reaches for it, not as a refusal to start. Each command re-reads the file, so a profile you add
# in the launcher's own TUI is offered by the next /model. A launcher running on ANOTHER machine is
# a different thing — reach that one as an mcp-servers: entry below; the two compose.
# llama-launcher: ~/configs/llama-launcher.yaml

# =============================================================================
# Autonomy mode: how tool calls are gated (the privilege ladder, least to most autonomous).
#   plan        — read-only: no writes, no command execution
#   ask-before  — every write, command, and external reach needs your approval (the default)
#   allow-edits — Apogee's own workspace edits run without asking; shell/exec, network, MCP,
#                 and any out-of-workspace write still gate (needs no confinement)
#   auto        — also runs the unbounded shell/subprocess surface unsupervised, fenced by
#                 confine-to-workspace below. Where the host offers no OS filesystem
#                 confinement (Windows today; most containers, where landlock reports
#                 ENOSYS), those commands ask for approval instead of running unfenced —
#                 apogee says so at startup and /confine off is the opt-out
#   flag: --mode       env: APOGEE_MODE
# mode: ask-before

# =============================================================================
# The system prompt: the standing instructions apogee sends ahead of your own first message,
# as the first system message of every request. Config-file only (no flag or env).
#
# system-prompt-text: below is the ONE active setting in this file — the default prompt a fresh
# install starts with. Edit it to make it your own; delete it, or comment it out, and apogee
# sends no system prompt at all (how apogee behaved before this key existed).
#
# Write it inline with system-prompt-text, or keep it in a file of its own and name that file
# with system-prompt-file — one or the other, never both at the same level (setting both is a
# startup error). A file path may start with ~ for your home directory, and a relative path is
# resolved against this apogee home — the directory this config.yaml lives in — so a prompt
# file travels with the rest of your configuration.
#
# Three placeholders are substituted fresh on every request:
#
#   {{workspace}}  — the absolute path of the workspace this session is scoped to
#   {{datetime}}   — today's date, e.g. 2026-07-26. The DATE only, deliberately: a per-request
#                    timestamp would change the prompt every turn and throw away the prefix
#                    cache your local server relies on
#   {{mode}}       — the current autonomy mode (plan | ask-before | allow-edits | auto), which
#                    follows a Shift+Tab switch from the next request onward
#
# The spelling is strict and the set is closed: anything else between double braces — including
# `{{ workspace }}`, with spaces — is a startup error listing these three.

system-prompt-text: |
  You are apogee, a coding agent working in the workspace at {{workspace}}.
  Today's date is {{datetime}}. You are operating in {{mode}} mode.

  Work step by step: read before you change, keep edits small and focused,
  and verify your work. Be direct and concise; when a task is done,
  summarise what changed.

# The same prompt, kept in a file instead of inline. Use one or the other: uncommenting this
# while the text above is still active is the both-set startup error.
# system-prompt-file: ~/prompts/apogee.md

# Per-model prompts. Key an entry by the model name apogee resolves at startup (the name in the
# status footer) and it REPLACES the global prompt above for that model — whole: an entry that
# sets only system-prompt-file does not inherit the global system-prompt-text. An entry naming a
# model you are not running is simply inert: never selected, and its file is never read — so one
# config can carry a prompt per model across every machine it travels to. Each entry uses the
# same two key spellings as above.
#
# system-prompt-models:
#   qwen2.5-coder:
#     system-prompt-text: "You are apogee. Answer with code first, prose second."
#   gpt-oss-20b:
#     system-prompt-file: ~/prompts/gpt-oss.md

# =============================================================================
# Workspace context files: files apogee looks for in the WORKSPACE ROOT and folds into the
# system prompt when a session starts — the AGENTS.md / CLAUDE.md behaviour. The system prompt
# above is what YOU always want said; these are what THIS PROJECT wants said, and a repo that
# already keeps an AGENTS.md for other agents is picked up with nothing configured here.
# Config-file only (no flag or env), like the system prompt it stands beside. Defaults below.
#
# EVERY listed name that exists is included, in list order — the list is an inclusion set, not a
# priority chain — each under a `## Workspace context: <name>` header, appended after the system
# prompt inside that same one first system message. Names are looked up in the workspace root
# ONLY: no parent-directory walk-up and no global context file (standing text that follows you
# from project to project is exactly what system-prompt-text/-file above are). A name must be a
# plain workspace-relative one: an absolute path, a name climbing out with "..", an empty entry,
# or the same name twice is a startup error naming the entry.
#
# A name that does not exist is skipped SILENTLY — the default will not exist in every repo, so
# absence is the normal case — and so is an empty file. A file that is present but cannot be
# read is skipped LOUDLY (a note in the transcript), never a startup failure: unlike
# system-prompt-file, which you named, these are discovered.
#
# The content is DATA and travels VERBATIM: the three placeholders above do NOT apply to it, so
# {{braces}} in some repo's AGENTS.md reach the model as written and can never fail apogee's
# startup.
#
# The files are read when a session STARTS and re-read by /clear, /new and a /sessions restore —
# never mid-conversation, so what the model was told stays fixed for the whole session and your
# server's prefix cache survives it. Edit AGENTS.md while apogee runs and the new text lands on
# your next /new.
#
# apogee names each file it loaded, with its size, in the transcript at every one of those
# boundaries, and warns when the standing system content (system prompt + context files) has
# outgrown its share of the context window. The warning is advisory only: nothing is ever capped
# or truncated, and with no window known yet there is no share to compare against and no warning.
#
# context-files:
#   enable: true             # the off-switch; default true
#   names: [AGENTS.md]       # the default; looked up in the workspace root, in this order
#                            # (an explicitly empty list, names: [], is the other way to say off)

# =============================================================================
# Auto's blast radius (only meaningful in --mode auto). GLOBAL-CONFIG-ONLY: there is no flag
# or env, and a project config cannot loosen it — editing THIS file is the deliberate
# acknowledgement. Default: true.
#   true   — filesystem writes are fenced to the workspace under OS confinement; the network
#            is open; MCP still asks. (The safe default.)
#   false  — "I am the sandbox": nothing is fenced and nothing asks, EXCEPT the dangerous-
#            action guard floor. Safe ONLY inside a VM/container — your responsibility. Prints
#            a warning every session.
# See also unconfined-hosts: below — the same loosen scoped to ONE machine, which the
# `/confine off --save` command records for you rather than making you edit this by hand.
# confine-to-workspace: true

# =============================================================================
# Machines you have acknowledged as disposable: on a host listed here, auto mode runs
# UNCONFINED — the same loosen as confine-to-workspace: false above, but scoped to one
# machine instead of every machine this file travels to. GLOBAL-CONFIG-ONLY, for the same
# reason as the flag (no project config, no flag, no env: nothing but this file may name
# your host). Default: EMPTY — no host is acknowledged, everything is confined.
#
# Resolution order: an explicit `confine-to-workspace: false` wins (unconfined everywhere);
# else an entry whose id matches THIS machine makes auto unconfined here; else confinement
# stays on. An id naming another machine is simply "not this host" — never an error, since
# the list is meant to accumulate. An entry with no id is skipped with a startup notice.
#
# The id is `<hostname>-<6 hex characters of a hash of the machine identifier>`; the
# `/confine` command reports this host's id, and `/confine off --save` appends the entry
# below for you (this file's comments and formatting survive the write). It is a
# safety INTERLOCK, not authentication: it stops an acknowledgement made on a throwaway
# container from silently following this file onto your laptop. It does not resist forgery,
# and it fails closed — a machine whose identifier changed is simply confined again.
#
# unconfined-hosts:
#   - id: "devbox-a1b2c3"                # this machine's host id (apogee prints it)
#     acknowledged: "2026-07-21"         # when you made the call — for your future self
#     note: "disposable container, landlock unavailable"

# =============================================================================
# Search endpoint for the web_search tool. With no endpoint set, web_search uses DuckDuckGo
# (HTML, no API key needed) — it works out of the box. Set it to `off` to disable web search,
# or point it at your own search backend, which receives the query as the `q` URL parameter
# (an HTML response is cleaned into title/url/snippet results; JSON/text passes through
# unchanged). Config-file only (no flag or env). The SSRF floor (loopback, private, and
# metadata addresses are always blocked, by resolved IP) applies regardless.
# web-search-endpoint: https://search.example.com/search

# =============================================================================
# External MCP (Model Context Protocol) servers to connect on startup. Default-EMPTY: with no
# servers listed, the MCP feature is dormant (no connections, no error). Each server's tools are
# discovered at startup and offered to the model, named "<server-name>__<tool>". Config-file only.
#
# An MCP server is an EXTERNAL, untrusted process Apogee cannot confine — so its tools ALWAYS ask
# for approval in auto mode (confine-to-workspace: true), the same as any unfenceable reach. A
# server reached over http(s) (sse / streamable-http) may live on localhost or your LAN: you named
# the address here, so it is exempt from the SSRF floor the network tools ride (that floor exists
# to stop the MODEL reaching internal addresses). The connection is PINNED to that endpoint's own
# addresses — any OTHER private address it is later pointed at is still refused — and redirects
# are not followed, so configure a redirecting server at the URL it redirects to. A stdio server
# is a local process you launch — you chose the command — so no URL check applies; its tools still
# ask in auto.
#
# mcp-servers:
#   - name: github                       # the prefix on each tool's name; must be unique
#     transport: stdio                   # stdio | sse | streamable-http
#     command: github-mcp-server         # stdio: the executable to launch
#     args: ["--stdio"]                  # stdio: optional arguments
#     env: ["GITHUB_TOKEN=…"]            # stdio: optional KEY=VALUE environment entries
#   - name: docs
#     transport: streamable-http         # sse | streamable-http: a remote http(s) server
#     endpoint: https://mcp.example.com/ # the server URL (http://127.0.0.1:… is fine too)

# =============================================================================
# Discover skills from the workspace's bare skills/ folder, in addition to the global library
# (~/.apogee/skills) and the project's .apogee/skills (both always loaded). A skill is a folder
# containing a SKILL.md (YAML frontmatter — id/name, displayName, summary/description — plus a
# Markdown body); attach one in chat with /skill to prepend its instructions to your next
# message. Config-file only (no flag or env). Default: true.
# use-project-skills: true

# =============================================================================
# Automatic context Compaction: when the conversation history outgrows its share of the model's
# context window, apogee summarises the older turns into a compact brief (the same fold the
# /compact command runs) before the next request, so a long session does not overflow the window.
# It is STRUCTURAL and load-bearing — it stays on even under --bypass — so set this to false only if
# you want to manage the window yourself with /compact. The same key also powers overflow recovery:
# when a request does not fit the window, apogee folds the history and retries the turn once instead
# of losing it, so auto-compact: false opts out of both and an overflowing turn then fails as it
# would without apogee. The on-demand /compact command works either way. Config-file only (no flag
# or env). Default: true.
# auto-compact: true

# =============================================================================
# The model's context window in tokens. This one IS a pin: the ten-second heartbeat never overrides
# it, so a model switch still rebinds but the window stays exactly what you set here. Leave it unset
# to discover the window from the server, live — including when the server switches models. Set it
# only when your server does not advertise a window, or when its number is wrong for how you run it.
# It drives the Budget and the automatic compaction above: with no window known, both stay inactive
# and apogee says so in the transcript the moment it binds a model without one. Config-file only (no
# flag or env).
# context-window: 32768

# =============================================================================
# How a finished document is shown to you. The model calls `present_document` after writing a
# deliverable (a report, a diagram, an HTML summary), and apogee decides how to surface it —
# the model never reasons about your platform. Config-file only (no flag or env).
#
# Whatever these keys say, the document's workspace-relative PATH is always printed in the
# transcript: that is the one rung that is never wrong, and most terminals (Zed, VS Code, iTerm2,
# WezTerm, kitty) make it cmd/ctrl+clickable. Above that baseline:
#
#   - running on your own desktop → apogee opens the document in the associated application
#     (HTML in your default browser). This is the `auto-open` key below. Only documents get
#     opened — reports, images, text; anything the OS would RUN rather than show (a .bat, a
#     .command, a .desktop) is left as a path in the transcript, for you to open deliberately.
#   - running over SSH (a devbox, a VM, a container) → apogee serves browser-renderable documents
#     (.html/.htm/.svg/.pdf) from a small built-in server and prints the URL beside the path, so
#     one cmd+click opens it in the browser on YOUR machine. It never auto-opens on the remote
#     box — there is no display there to open into.
#
# The built-in server hands out ONE random-token URL per presented document (no directory
# listing, no other file reachable), re-reads the file per request, starts only when a document
# is actually served, and stops when apogee exits.
#
# present:
#   auto-open: true      # open documents on a LOCAL desktop run; false = only print the path
#   command: "zed {path}"  # open with THIS application instead of the OS default ({path} = the file)
#   port: 0              # the built-in server's port; 0 (default) picks a free one per session
#   host: ""             # address the printed URL advertises; empty = detected (see below)
#
# `host` is a FALLBACK, not an override: over SSH the address you connected to this box on
# (from $SSH_CONNECTION) is used, because it is known-routable. Set `host` for topologies SSH
# cannot describe — a container behind a NAT, a VM you reach by another name.
#
# TROUBLESHOOTING an unreachable URL: on macOS Sequoia and later, the FIRST connection from a
# browser to a local-network address needs Local Network permission. Chrome fails with a generic
# "this site can't be reached" until you allow it in System Settings → Privacy & Security → Local
# Network; Safari tends to work straight away. Try the URL in Safari before suspecting apogee —
# and the path line in the transcript works regardless.

# =============================================================================
# How the terminal UI presents itself. Today that is the status-line spinner — the animation you
# watch while a turn runs. Config-file only (no flag or env).
#
# The two keys are INDEPENDENT: `spinner` picks the glyph animation, `spinner-color` says whether
# it drifts through colour, and the colour loop applies to whichever style you name. Setting one
# key leaves the other at its default. Defaults: snake, with the colour loop on.
#
#   snake    — a six-dot snake runs the outer ring of a 4x4 dot grid (two braille cells side by
#              side), one lap a second. Two columns wide.
#   glitter  — two braille cells re-roll twenty times a second while the number of lit dots
#              breathes in and out over six seconds, swelling to a solid ⣿⣿ and falling away
#              again. Two columns wide.
#   classic  — the single cell ⣾⣽⣻⢿⡿⣟⣯⣷ appears to rotate, ten frames a second: the spinner
#              apogee has always shown, kept as a permanent choice rather than a fallback.
#              One column wide.
#
# The colour loop is a soft ten-second lap through three colours already on this screen —
# periwinkle → turquoise → blue → back — blended so no step is visible. The lap takes ten
# seconds under every style. With `spinner-color: false` the glyph keeps your terminal's own text
# colour: `classic` with the loop off is exactly the status line apogee rendered before these
# styles existed, and `classic` with it on is those same glyphs in the new colours.
#
# CAVEAT: apogee does not detect your terminal's colour depth. On a 256-colour terminal the
# gradient steps visibly, and on a 16-colour one it collapses to a couple of tones — that is what
# `spinner-color: false` is for.
#
# ui:
#   spinner: snake         # snake | glitter | classic
#   spinner-color: true    # the 10s colour loop; false = your terminal's own text colour

# =============================================================================
# The prompt cursor — apogee draws the real terminal cursor, always steady, in the shape named here:
# block (the default) | underline | bar. Nothing blinks, and there is no key to make it blink. The
# shape the terminal itself is configured with cannot be inherited while apogee runs: a full-screen
# terminal program names a cursor shape on every frame, so this key is how you say which. Your
# terminal's own cursor comes back when apogee exits. Config-file only (no flag or env).
# cursor-shape: block

# =============================================================================
# Run with Mechanisms off; the structural context reducers stay on (ADR 0006).
#   flag: --bypass     env: APOGEE_BYPASS
# bypass: false

# =============================================================================
# Catalogued small-model Mechanisms to enable, by canonical ID (Phase 4). Config-file only (no
# flag or env). Each Mechanism ships OFF by default — enabled only once its A/B bench run has
# proven it a win — so this block is how you opt one in. Map each ID to true to enable it; an
# unknown ID is a startup error that lists the IDs this build knows. Bypass still wins: an enabled
# non-off-ramp Mechanism does not fire under --bypass. The catalogue fills in as the port waves
# land (see docs/design/mechanism-catalogue.md); until a Mechanism's wave ships, enabling its ID
# errors.
#
# RECOMMENDED on a small context window (~32k): tool_result_cap. The automatic Compaction above
# folds only BETWEEN Exchanges — its emergency twin does fold mid-Exchange, but only once a request
# has already overflowed, which is a rescue rather than a plan (it costs a summary call and rewrites
# your history into a summary). tool_result_cap is the one reducer that SHAPES a request
# mid-Exchange, capping any single oversized tool result to its Budget share, so a doc-heavy task's
# whole-file reads stay affordable instead of leaning on that rescue.
#
# CAVEAT (ADR 0016): a non-empty mechanisms: block means manual control — a Validated set
# matching your model (see below) is then NOT auto-applied; apogee prints a one-line notice
# naming it instead. Leave this block commented out to let Validated sets apply automatically.
#
# mechanisms:
#   tool_result_cap: true       # cap any single oversized tool result — the mid-Exchange tuning valve
#   validate: true              # tool-call validation + auto-retry
#   syntax: true                # write-content syntax check
#   autofix: true               # formatter pass on tool-call payloads
#   truncate_history: false     # explicitly off (the default) — shown for reference
#   guided_decomposition: true  # oversized task → serialized sub_agent fan-out (needs tool_result_cap)

# =============================================================================
# Validated sets (ADR 0016): per-model Mechanism sets bench-proven SAFE (non-inferior to
# --bypass) on a specific model. When the model apogee resolves at startup matches an entry —
# shipped with the binary, or your own under ~/.apogee/validated/ — the set applies
# automatically at ≥ medium fingerprint confidence, and at low (name-only) confidence apogee
# prints a one-line offer instead: paste the alias it names to confirm your model IS the one
# measured. Your explicit mechanisms: block above always wins (a validated set applies whole
# or not at all), and --bypass suppresses everything. Config-file only (no flag or env).
#
# validated-sets:
#   enable: true                # the off-switch; default true
#   alias:                      # explicit carry-over: runtime model label -> entry key
#     # gemma-4-e4b-it-qat: gemma-4-e4b-it-qat     # identity = "my model is what it says"
#     # my-gemma-quant: gemma-4-e4b-it-qat         # transfer to a sibling quant (your call)
