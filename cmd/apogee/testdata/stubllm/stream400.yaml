# The upstream the T-24 streaming tests talk to: one very long reply, arriving in small deltas
# with a real pause between them, so a driver can watch it grow.
#
# The shape is the checklist's own: "a 400-line numbered list, one short sentence per line,
# numbered 1 to 400 with no gaps". Every line is unique and self-identifying, which is what makes
# "no gaps, no repeats, nothing out of order" a claim a test can settle line by line, and what
# makes a mid-word join visible — a bad append lands INSIDE a word rather than between two.
#
# chunk_runes 3 and token_delay 1ms are the point rather than a detail: three runes cuts most
# lines mid-word, so the chunk-list buffer is joined at boundaries a naive append would corrupt,
# and a millisecond apiece is a stream slow enough to resize, cancel and measure mid-flight.
model: stream-model
turns:
    # The session title. apogee asks for one off the first prompt, so this has to be matched
    # BEFORE the prompt's own turn or it would take it.
    - when:
        last_message: The user's first request
      repeat: true
      text: A numbered list
    # The reply under test: 400 numbered lines, three runes at a time, a millisecond apart.
    - when:
        last_message: ^Write a 400-line numbered list
      token_delay: 1ms
      chunk_runes: 3
      text: |
