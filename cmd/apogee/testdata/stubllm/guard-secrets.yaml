# The upstream TestE2EGuardSecrets* talks to: a model that answers each prompt with one git_commit
# call, staging the file the prompt names.
#
# The two files are chosen for what the commit-secrets pre-check (internal/agent secretsguard.go,
# internal/security's `commit-secrets` rule — ADR 0080) makes of them. `.env` holding an AWS access
# key id is secret material twice over — by its name and by its content — so the call is forced
# onto the approval pane in every mode, with the scanner's finding on the Fix row. `notes.txt`
# holding a line of prose is clean: no pane, and the commit lands. What this script pins is that
# the registry's real git_commit — over a real repository the pre-check can shadow-stage and
# diff — is what the guard reads, rather than the fixtures internal/agent's own tests hand it.
#
# Every turn repeats: apogee's own asides (the title, a summary) would otherwise consume a turn.
model: guard-secrets-model
turns:
    # The session title. apogee asks for one off the first prompt, so this has to be matched BEFORE
    # the prompt's own turn or it would take it (see smoke.yaml).
    - when:
        last_message: The user's first request
      repeat: true
      text: Commits under the secrets guard
    # The wrap-up once a DENIED commit has come back. The denial is a git_commit tool result like any
    # other, so it is told apart from a landed one by its own text — the guard's hint is what the
    # model was handed — and matched BEFORE the generic wrap-up below.
    - when:
        tool_result: git_commit
        last_message: ^tool call denied by approver
      repeat: true
      text: The secret stayed out of history.
    # The wrap-up once a LANDED commit has come back. Matched BEFORE the prompt turns below so a
    # result can never be answered as a fresh request.
    - when:
        tool_result: git_commit
      repeat: true
      text: The commit is in.
    # The SECRET: an untracked `.env` whose one line is an AWS access key id. The pre-check's shadow
    # staging finds it by name and by content, and the call is forced onto the pane.
    - when:
        last_message: ^Commit the env file
      repeat: true
      tool_calls:
        - name: git_commit
          arguments: '{"message":"add the env file","files":[".env"]}'
    # The CONTROL: an untracked `notes.txt` holding a line of prose. Nothing to find, so nothing is
    # asked and the commit lands.
    - when:
        last_message: ^Commit the notes file
      repeat: true
      tool_calls:
        - name: git_commit
          arguments: '{"message":"add the notes file","files":["notes.txt"]}'
    # Anything apogee asks on its own account.
    - repeat: true
      text: Nothing else to add.
