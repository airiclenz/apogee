# The upstream TestE2EUpstreamEOFIsReStreamed talks to: a server whose first reply dies mid-stream.
#
# Turn 1 streams the first three runes of its text and then KILLS the connection — no terminal
# chunk, no clean end — so the client's read fails with io.ErrUnexpectedEOF partway through the
# reply. That is the fault the loop re-streams, like an in-band 502, up to the Turn's re-stream
# budget. Turn 2 is the reply the re-stream gets: the answer the run commits, and the proof that
# the re-stream happened is that this text — not the three runes before the cut — is what reaches
# stdout, after exactly two requests.
#
# TestE2EUpstreamEOFPastTheBudgetFaults and TestE2EUpstreamEOFBudgetZeroNeverReStreams reuse turn 1
# in EVERY position (built in Go from this file) under a `re-stream-budget:` of their own, so the
# cut past the budget lands on a Turn with no re-stream left and the run faults.
model: eof-model
turns:
    - text: Hello before the cut.
      cut:
        after_runes: 3
    - text: Hello after the retry.
