# The upstream the tool-call salvage tests talk to: a model on a NATIVE profile that answers a
# request for work by writing the call out as JSON in its visible text instead of sending it on the
# wire your server understands. That is the failure the `tool-call-salvage` Floor guard exists for
# (ADR 0071), and no unit test can make the claim this file makes — that the call the guard read
# back out of the text reaches the SERVER on the next request, as a real assistant `tool_calls`
# entry with a real tool result answering it.
#
# One prompt per CONTAINER the guard reads, because a container is a wire shape and not a unit-test
# detail: a fenced block, a <tool_call> tag pair, and a reply that is nothing but the call. The
# first two are deliberately narration PLUS the container, because both halves are under test —
# the container is what becomes the call, and the narration is what has to survive as the visible
# reply; the third carries no narration at all, since a reply that IS the call has none to keep.
model: salvage-model
turns:
    # The session title. apogee asks for one off the first prompt, so this has to be matched BEFORE
    # the prompt's own turn or it would take it (see smoke.yaml).
    - when:
        last_message: The user's first request
      repeat: true
      text: A call written out in text
    # The wrap-up once the salvaged call has come back. Matched BEFORE the prompt turn below so a
    # tool result can never be answered as a fresh request.
    - when:
        tool_result: read_file
      repeat: true
      text: The file holds one line, and it says hello.
      token_delay: 1ms
      chunk_runes: 6
    # The first turn under test. No `tool_calls:` at all — the call is JSON in the CONTENT, fenced,
    # with the narration the reply must keep once the fence has been cut out of it.
    - when:
        last_message: ^Read a.txt
      repeat: true
      text: |-
        I will read that file now.

        ```json
        {"name": "read_file", "arguments": {"path": "a.txt"}}
        ```
      token_delay: 1ms
      chunk_runes: 6
    # The same mistake in the <tool_call> tag pair several instruct-tuned families reach for when
    # their native channel is gone. Narration again, so the tags are proven to be cut out of the
    # visible reply rather than merely parsed.
    - when:
        last_message: ^Show a.txt
      repeat: true
      text: |-
        Reading it with the tag shape.

        <tool_call>{"name": "read_file", "arguments": {"path": "a.txt"}}</tool_call>
      token_delay: 1ms
      chunk_runes: 6
    # And the barest shape of all: the whole reply is the call object, with no container around it
    # and no narration beside it. There is nothing left to show once the guard has taken it.
    - when:
        last_message: ^Fetch a.txt
      repeat: true
      text: '{"name": "read_file", "arguments": {"path": "a.txt"}}'
      token_delay: 1ms
      chunk_runes: 6
    # Anything apogee asks on its own account.
    - repeat: true
      text: OK.
