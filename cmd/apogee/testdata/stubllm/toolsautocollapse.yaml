# The upstream the auto-collapse runs talk to (TestE2EToolsAutoCollapse*): two prompts that each make
# the model issue one batch of groupable calls, six that each make it issue one block of another
# shape — two lone calls, a lone delegation, two Sub-agents groups, a Skill group — and one that
# only talks.
#
#   - "Survey the workspace." issues toolsfold.yaml's three calls of three different tools — Read,
#     List and Grep — so its umbrella's Group summary is the one e2e_toolsfold_test.go spells
#     (toolsFoldHeader), and the wrap-up that follows it is what settles the umbrella.
#   - "Read the missing file." issues two calls, one of them a read of a path the workspace does not
#     hold (e2eWorkspace seeds a.txt only), so the umbrella carries one failed call beside one
#     that succeeds, and its Group summary (autoCollapseFailedHeader) counts the failure in its
#     outcome half.
#   - "Read the one file." issues ONE read_file call — a lone call, which stands as a group of one.
#   - "Search for a zebra." issues ONE grep call for a pattern the workspace does not hold — a lone
#     call whose "No matches found" result tells it from the survey's grep — and its wrap-up is
#     HELD on the `zebra` gate, so the group of one is shown to fold when that next Turn starts.
#   - "Delegate one check." issues ONE sub_agent call — a lone delegation, which stands as a
#     `✦ Sub-agents (1)` group of one; its child answers with a sentence of its own, so its wrap-up
#     is told from the two-check group's.
#   - "Delegate two checks." issues two sub_agent calls in one reply, so they stand as one
#     `✦ Sub-agents (2)` group; each child answers its task with text alone.
#   - "Fetch two skills." issues two load_skill calls in one reply, so they stand as one
#     `✦ Skill (2)` group. The home carries no skills, so each fetch is a miss — still a successful
#     result (internal/tools LoadSkill), and the row keeps the query it was asked with.
#   - "Delegate two inspections." issues two sub_agent calls in one reply, like "Delegate two checks."
#     but with tasks and answers of their own, and its wrap-up is HELD on the `wings` gate: the
#     request that carries the group's results waits until the test has seen the group fold, so
#     the fold is shown to land when that next Turn starts, before its reply commits anything.
#   - "Anything else?" is the next reply after a settled block: text only, no call.
#
# All calls are harmless reads, or delegations whose children only talk: a driven run boots in
# ask-before, where a gated call would hold the Turn open on its approval pane, and these runs want
# each block settled. Every turn matches on
# `when:` and repeats, because one run spans TWO launches — the session resumed with `--continue`
# replays the conversation. The title turn sits first for smoke.yaml's reason (`auto-title:` is on
# by default), and the trailing catch-all answers anything the prompts and their results do not claim.
model: toolsautocollapse-model
turns:
    # The session title, matched before the prompts' own turns.
    - when:
        last_message: The user's first request
      repeat: true
      text: Workspace survey
    # The zebra search's wrap-up, once its lone grep has found nothing — held on the `zebra` gate
    # until the test has seen the group of one fold (TestE2EToolsAutoCollapseRefoldsALoneCall). It
    # sits AHEAD of the survey's wrap-up, and its `last_message` names a result only a search that
    # found nothing gives, so the survey's wrap-up is never held. The wrap-ups sit AHEAD of the
    # prompt turns so a request carrying results can never be answered as a fresh request.
    - when:
        tool_result: grep
        last_message: ^No matches found
      repeat: true
      await: zebra
      text: Nothing turned up.
    # The survey's wrap-up, once its last result (grep's) has come back.
    - when:
        tool_result: grep
      repeat: true
      text: The workspace is surveyed.
    # The missing file's wrap-up, once its last result (list_dir's) has come back. The survey's
    # list_dir result is never the LAST message of its request — grep's follows it — so this turn
    # cannot claim the survey's wrap-up.
    - when:
        tool_result: list_dir
      repeat: true
      text: The file is not there.
    # The lone read's wrap-up. The survey's read_file result is never the LAST message of its
    # request (list_dir's and grep's follow it), nor is the missing file's (list_dir's follows it), so
    # this turn claims the lone read alone.
    - when:
        tool_result: read_file
      repeat: true
      text: The one file is read.
    # The inspections' wrap-up, once the south wing's delegation has reported — held on the `wings`
    # gate until the test has seen the group fold (TestE2EToolsAutoCollapseFoldsAGroupWhenTheNextTurnStarts).
    # It sits AHEAD of the checks' wrap-up below, and its `last_message` names an answer only the
    # inspections' second child gives, so the checks' wrap-up is never held.
    - when:
        tool_result: sub_agent
        last_message: South wing inspected
      repeat: true
      await: wings
      text: Both wings inspected.
    # The lone delegation's wrap-up, once its one child has reported — matched AHEAD of the checks'
    # wrap-up below on the answer only that child gives.
    - when:
        tool_result: sub_agent
        last_message: Corner looked over
      repeat: true
      text: The one check reported.
    # The Sub-agents group's wrap-up, once the second delegation has reported.
    - when:
        tool_result: sub_agent
      repeat: true
      text: Both checks reported.
    # The Skill group's wrap-up, once the second fetch has come back.
    - when:
        tool_result: load_skill
      repeat: true
      text: Both skills fetched.
    - when:
        last_message: ^Survey the workspace
      repeat: true
      tool_calls:
        - name: read_file
          arguments: '{"path":"a.txt"}'
        - name: list_dir
          arguments: '{"path":"."}'
        - name: grep
          arguments: '{"pattern":"hello"}'
    - when:
        last_message: ^Read the missing file
      repeat: true
      tool_calls:
        - name: read_file
          arguments: '{"path":"missing.txt"}'
        - name: list_dir
          arguments: '{"path":"."}'
    - when:
        last_message: ^Read the one file
      repeat: true
      tool_calls:
        - name: read_file
          arguments: '{"path":"a.txt"}'
    - when:
        last_message: ^Search for a zebra
      repeat: true
      tool_calls:
        - name: grep
          arguments: '{"pattern":"zebra"}'
    - when:
        last_message: ^Delegate one check
      repeat: true
      tool_calls:
        - name: sub_agent
          arguments: '{"task":"Look over the gamma corner","name":"gamma"}'
    # The lone delegation's CHILD, answering its one task.
    - when:
        last_message: ^Look over the gamma corner
      repeat: true
      text: Corner looked over.
    - when:
        last_message: ^Delegate two checks
      repeat: true
      tool_calls:
        - name: sub_agent
          arguments: '{"task":"Check the alpha corner","name":"alpha"}'
        - name: sub_agent
          arguments: '{"task":"Check the beta corner","name":"beta"}'
    # Each CHILD's one Turn, picked by the task the parent handed it.
    - when:
        last_message: ^Check the
      repeat: true
      text: Corner checked.
    - when:
        last_message: ^Delegate two inspections
      repeat: true
      tool_calls:
        - name: sub_agent
          arguments: '{"task":"Inspect the north wing","name":"north"}'
        - name: sub_agent
          arguments: '{"task":"Inspect the south wing","name":"south"}'
    # The inspections' two children, each answering its own wing.
    - when:
        last_message: ^Inspect the north wing
      repeat: true
      text: North wing inspected.
    - when:
        last_message: ^Inspect the south wing
      repeat: true
      text: South wing inspected.
    - when:
        last_message: ^Fetch two skills
      repeat: true
      tool_calls:
        - name: load_skill
          arguments: '{"query":"format Go"}'
        - name: load_skill
          arguments: '{"query":"cut a release"}'
    - when:
        last_message: ^Anything else
      repeat: true
      text: Nothing more to report.
    # Anything else — a Mechanism's own call, or a round the prompts do not claim.
    - repeat: true
      text: Nothing else to add.
