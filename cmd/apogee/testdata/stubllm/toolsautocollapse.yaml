# The upstream the auto-collapse runs talk to (TestE2EToolsAutoCollapse*): two prompts that each make
# the model issue one batch of groupable calls, and a third that only talks.
#
#   - "Survey the workspace." issues toolsfold.yaml's three calls of three different tools — Read,
#     List and Grep — so its umbrella's Group summary is the one e2e_toolsfold_test.go spells
#     (toolsFoldHeader), and the wrap-up that follows it is what settles the umbrella.
#   - "Read the missing file." issues two calls, one of them a read of a path the workspace does not
#     hold (e2eWorkspace seeds a.txt only), so the umbrella carries one failed call; two calls,
#     because an umbrella needs at least two (toolSuperGroup's floor).
#   - "Anything else?" is the next reply after a settled umbrella: text only, no call.
#
# All calls are harmless reads: a driven run boots in ask-before, where a gated call would hold the
# Turn open on its approval pane, and these runs want the umbrella settled. Every turn matches on
# `when:` and repeats, because one run spans TWO launches — the session resumed with `--continue`
# replays the conversation. The title turn sits first for smoke.yaml's reason (`auto-title:` is on
# by default), and the trailing catch-all answers anything the prompts and their results do not claim.
model: toolsautocollapse-model
turns:
    # The session title, matched before the prompts' own turns.
    - when:
        last_message: The user's first request
      repeat: true
      text: Workspace survey
    # The survey's wrap-up, once its last result (grep's) has come back. The wrap-ups sit AHEAD of
    # the prompt turns so a request carrying results can never be answered as a fresh request.
    - when:
        tool_result: grep
      repeat: true
      text: The workspace is surveyed.
    # The missing file's wrap-up, once its last result (list_dir's) has come back. The survey's
    # list_dir result is never the LAST message of its request — grep's follows it — so this turn
    # cannot claim the survey's wrap-up.
    - when:
        tool_result: list_dir
      repeat: true
      text: The file is not there.
    - when:
        last_message: ^Survey the workspace
      repeat: true
      tool_calls:
        - name: read_file
          arguments: '{"path":"a.txt"}'
        - name: list_dir
          arguments: '{"path":"."}'
        - name: grep
          arguments: '{"pattern":"hello"}'
    - when:
        last_message: ^Read the missing file
      repeat: true
      tool_calls:
        - name: read_file
          arguments: '{"path":"missing.txt"}'
        - name: list_dir
          arguments: '{"path":"."}'
    - when:
        last_message: ^Anything else
      repeat: true
      text: Nothing more to report.
    # Anything else — a Mechanism's own call, or a round the prompts do not claim.
    - repeat: true
      text: Nothing else to add.
