# apogee configuration — ~/.apogee/config.yaml
#
# This file is created automatically on first run from a template compiled into the
# apogee binary. Your edits are preserved: apogee never overwrites an existing config.
#
# Settings resolve by precedence, highest first:
#
#   command-line flag  >  APOGEE_* environment variable  >  this file  >  built-in default
#
# Three keys have all four layers — server: (--server, APOGEE_SERVER), mode: (--mode,
# APOGEE_MODE) and bypass: (--bypass, APOGEE_BYPASS). Every other key here is config-file only,
# and says so where it is documented.
#
# Two raw overrides are NOT config keys at all, which is why no key below spells them: --endpoint
# / APOGEE_ENDPOINT starts THIS run on an UNLISTED server — it wins over any server: name and is
# never written back here — while APOGEE_API_KEY and --model / APOGEE_MODEL carry that unlisted
# server's bearer token and model hint, or overlay those two fields of the listed entry the run
# starts on.
#
# Every line below is commented out with ONE exception — system-prompt-text:, the default
# system prompt — so out of the box this file changes nothing else; it is a documented
# starting point. Uncomment a line and edit it to make it your default; delete or comment
# out the system prompt to send none.
#
# The /settings command shows these values in-app and edits the simple ones, writing each
# change back into this file — one key at a time, comments and layout kept as you left them.

# =============================================================================
# The servers you run models on — the SINGLE definition of what apogee can talk to. Each entry
# is one OpenAI-compatible server; the server: key below names the one a session STARTS on, and
# /server moves a running session to any other one without restarting apogee and without losing
# the conversation. Config-file only (no flag or env): an invocation picks an entry by name
# (--server) or points at an unlisted URL (--endpoint), and neither defines a server here.
#
# The default is empty — and a session needs a server, so with nothing listed an interactive
# apogee opens /settings and points you back at this file (`apogee headless` and `apogee probe`
# have nobody to ask, so they refuse to start and print the same pointer). Add one entry and you
# are running.
#
#   name       what the entry is called: the label /server lists it under, the argument
#              `/server <name>` takes, the value server: below points at, and the host name the
#              status footer shows while the session is on it. Required, and no two entries may
#              share one.
#   endpoint   that server's OpenAI-compatible URL — the BASE, without `/v1`: apogee appends
#              `/v1/chat/completions` and `/v1/models` itself, so OpenRouter is
#              `https://openrouter.ai/api`. Spelled with the suffix, the chat and model-list
#              requests land on `/api/v1/v1/…` and 404s. Required.
#   api-key    the bearer token that server wants, if it wants one — llama.cpp started with
#              --api-key, LM Studio, a remote vLLM, any keyed OpenAI-compatible proxy. It is
#              sent as `Authorization: Bearer <key>` on EVERY request to that server: your
#              conversation, the ten-second heartbeat, and both halves of `apogee probe`.
#              Optional — leave it out for a keyless local server and no Authorization header is
#              sent at all. APOGEE_API_KEY overrides it for the server this session starts on
#              (no flag, deliberately: a secret typed on the command line lands in your shell
#              history and in `ps` output on every OS), so a key here is your per-machine
#              default and the variable is the override. CAVEAT: this file is plain text — on a
#              shared machine prefer the environment variable, or restrict this file's
#              permissions yourself. apogee reports whether a key was resolved (`apogee probe`,
#              the upstream block); the value is never printed, and the provider client redacts
#              it from server-echoed errors.
#   api-key-cmd
#              a command whose standard OUTPUT is that key — the way to keep the token out of
#              this file entirely, by naming the password manager or keychain that already holds
#              it:
#
#                api-key-cmd: pass show apogee/rented-box
#                api-key-cmd: op read op://Private/rented-box/credential
#                api-key-cmd: security find-generic-password -s apogee -a rented-box -w
#
#              It runs the first time this session actually needs that server's key — never at
#              startup for entries you do not use — and the answer is remembered for the rest of
#              the session. The line is split on spaces and quotes and run DIRECTLY, with NO
#              shell, so pipes, redirections and $VARIABLES need a wrapper script of your own.
#              It gets no terminal and no input, so a backend that has to ask you to unlock must
#              prompt through a GUI agent (pinentry-mac, the Keychain dialog). Trailing
#              whitespace is trimmed. A non-zero exit, a timeout (60 seconds) or empty output is
#              an ERROR naming this entry — never a silent keyless request, because "no key" is
#              spelled by leaving all three of these keys out.
#   api-key-env
#              the NAME of an environment variable that holds the key — not the key itself:
#
#                api-key-env: OPENROUTER_API_KEY
#
#              read when that server's key is first needed, from the environment apogee itself
#              was started in. Unset or empty is the same error as an empty command output, not a
#              keyless request. Useful when a launcher, a systemd unit or your shell profile
#              already puts the token in the environment.
#
#              Exactly ONE of api-key, api-key-cmd and api-key-env per entry: two sources for one
#              value is a startup error, because nothing can say which of them the file meant.
#              None of the three is the keyless server described above.
#   model      that server's model hint: which of the models it serves you mean. Optional —
#              leave it out and the first heartbeat binds whatever is loaded, which is all a
#              single-model server (e.g. llama.cpp's llama-server) needs; apogee then follows
#              that server, rebinding within ten seconds whenever the loaded model changes
#              under a running session and saying so in the transcript. Set it and this id is
#              what goes on the wire, advertised or not — the server's model list only supplies
#              the context window, from the matching entry or, for a variant slug like
#              `vendor/model:exacto`, from its base entry. An id the list cannot place at all
#              still runs, with the context window unknown (the Budget and auto-compaction then
#              inactive), and apogee says so once in the transcript at startup.
#              --model / APOGEE_MODEL overrides it for the server this session starts on.
#              Whichever name a run ends up bound to — set here or discovered from the server — is
#              also the name the Model profile is matched on: how that model speaks the wire is
#              resolved per model from model-profiles: at the end of this file over apogee's
#              built-in shape table, and re-resolved whenever the bound model changes.
#   llama-launcher
#              lets apogee start, switch and stop THIS server itself, with llama-launcher — the
#              tool that owns the model files and the launch profiles on the machine that entry
#              runs on. While a session is on an entry that carries this key, /model offers the
#              launcher's launch profiles instead of what the server advertises and waits while
#              the one you pick starts, /unload-model frees that server's model, and /stop-server
#              stops it; all three are ordinary rows in the / menu. Optional, and three shapes:
#
#                (absent)  no launcher for this server — /model lists what the server
#                          advertises, and /unload-model and /stop-server answer
#                          "llama-launcher not configured". This is the default, and it is what
#                          every remote entry wants.
#                auto      read llama-launcher's own default config,
#                          ~/.config/llama-launcher/config.yaml.
#                <path>    read THIS launcher config instead (~ expands).
#
#              The integration FOLLOWS the session: /server onto a launcher-fronted entry turns
#              it on, /server onto any other entry turns it off again, so one config can hold a
#              local machine you launch models on and a remote provider you do not. Nothing is
#              checked at startup — a config that is not there is reported the first time a
#              command reaches for it, not as a refusal to start — and each command re-reads the
#              file, so a profile you add in the launcher's own TUI is offered by the next
#              /model. A launcher running on ANOTHER machine is a different thing: reach that one
#              as an mcp-servers: entry below; the two compose.
#   launch-profile
#              the launch profile this launcher-fronted server comes back on: with
#              remember-model: true above, apogee writes the profile you load with /model here, and
#              the next start loads it again for you — but only when nothing is serving on that
#              launcher yet, so a model you started by hand, or left running, is joined rather than
#              stacked on top of. Set it by hand to choose the profile a fresh machine starts with.
#              It rides an entry that carries llama-launcher: (the profile is loaded THROUGH the
#              launcher, so an entry apogee cannot launch has nothing to actuate it, and apogee says
#              so at startup); a plain multi-model server records its choice in model: instead, and
#              a launcher-fronted entry leaves model: empty. Whether the profile still exists is not
#              checked at startup — the launcher's own config is re-read every time, so a profile
#              you renamed since is reported in the transcript and the restore is skipped.
#
#                launch-profile: gpt-oss-20b
#
#              llama-launcher's own config is never written by apogee: this pointer is apogee's
#              record of your choice, not a change to the launcher's profiles.
#   parallel-agents
#              how many sub-agents this server may run at once. When one model reply asks for
#              several delegations, apogee runs up to this many of them side by side instead of
#              one after another, and guided decomposition dispatches batches of the same size.
#              Optional, and it is a PIN — set it and nothing overrides it:
#
#                (absent)  ask the server: apogee uses the slot count it advertises. A server
#                          that advertises none — a cloud endpoint, anything without /props —
#                          means 1, one agent at a time: exactly today's behaviour, and what
#                          you get until a server says otherwise.
#                N         run at most N at once, whatever the server says. 1 keeps delegations
#                          strictly serial.
#
#              Worth knowing before raising it: a llama.cpp server started with --parallel N
#              splits its context window into N slots, so more parallel agents means a SMALLER
#              window each. apogee's context numbers are per-slot either way, so the footer
#              keeps telling you what you actually have.
#
# servers:
#   - name: workstation
#     endpoint: http://192.168.64.1:1111
#     model: gpt-oss-20b
#     llama-launcher: auto
#     parallel-agents: 4
#   - name: rented-box
#     endpoint: https://llm.example.com
#     api-key: sk-rented-token
#   - name: keychain-box
#     endpoint: https://llm.example.com
#     api-key-cmd: security find-generic-password -s apogee -a keychain-box -w
#   - name: openrouter
#     endpoint: https://openrouter.ai/api
#     api-key-env: OPENROUTER_API_KEY

# =============================================================================
# Which servers: entry a session starts on — the name of one of the entries above. apogee keeps
# this current for you: every /server switch to a listed entry writes the key back into this
# file, so the next launch starts where you left off. A move to a server the list does NOT name
# — an --endpoint URL, a llama-launcher profile — records nothing.
#
# Leave it unset and the first run ASKS: apogee starts with no server bound, opens the /server
# picker over the list above, and records what you choose. A name no entry above carries is
# handled the same way — apogee says which name went missing and opens the picker — rather than
# refusing to start. Only the interactive session asks: `apogee headless` and `apogee probe` have
# no one in front of them, so an unset or stale name stops them with an error naming this file.
#   flag: --server     env: APOGEE_SERVER
# server: my-box

# =============================================================================
# Autonomy mode: how tool calls are gated (the privilege ladder, least to most autonomous).
#   plan        — read-only: no writes, no command execution
#   ask-before  — every write, command, and external reach needs your approval (the default)
#   allow-edits — Apogee's own workspace edits run without asking; shell/exec, network, MCP,
#                 and any out-of-workspace write still gate (needs no confinement)
#   auto        — also runs the unbounded shell/subprocess surface unsupervised, fenced by
#                 confine-to-workspace below. Where the host offers no OS filesystem
#                 confinement (Windows today; most containers, where landlock reports
#                 ENOSYS), those commands ask for approval instead of running unfenced —
#                 apogee says so at startup and /confine off is the opt-out
#   flag: --mode       env: APOGEE_MODE
# mode: ask-before

# =============================================================================
# The system prompt: the standing instructions apogee sends ahead of your own first message,
# as the first system message of every request. Config-file only (no flag or env).
#
# system-prompt-text: below is the ONE active setting in this file — the default prompt a fresh
# install starts with. Edit it to make it your own; delete it, or comment it out, and apogee
# sends no system prompt at all (how apogee behaved before this key existed).
#
# Write it inline with system-prompt-text, or keep it in a file of its own and name that file
# with system-prompt-file — one or the other, never both at the same level (setting both is a
# startup error). A file path may start with ~ for your home directory, and a relative path is
# resolved against this apogee home — the directory this config.yaml lives in — so a prompt
# file travels with the rest of your configuration.
#
# Four placeholders are substituted fresh on every request:
#
#   {{workspace}}  — the absolute path of the workspace this session is scoped to
#   {{datetime}}   — today's date, e.g. 2026-07-26. The DATE only, deliberately: a per-request
#                    timestamp would change the prompt every turn and throw away the prefix
#                    cache your local server relies on
#   {{mode}}       — the current autonomy mode (plan | ask-before | allow-edits | auto), which
#                    follows a Shift+Tab switch from the next request onward
#   {{scratch}}    — this session's own scratch directory (~/.apogee/scratch/<session-id>),
#                    writable even when workspace confinement is on; constant for the life
#                    of a session, so the prefix cache holds. apogee's own orientation block
#                    already names it, so use the placeholder only when your own prose wants
#                    the path
#
# The spelling is strict and the set is closed: anything else between double braces — including
# `{{ workspace }}`, with spaces — is a startup error listing these four.

system-prompt-text: |
  You are apogee, a coding agent working in the workspace at {{workspace}}.
  Today's date is {{datetime}}. You are operating in {{mode}} mode.

  Work step by step: read before you change, keep edits small and focused,
  and verify your work. Be direct and concise; when a task is done,
  summarise what changed. When you need the user's input or a decision,
  call the ask_user tool — never ask in plain chat text.

  Be extremely concise: answer only what was asked — no filler, no preamble.
  Lead with the result: what you did, whether it worked, what comes next.
  Prefer short bullet lists over long paragraphs; a short answer stays one line.
  When asking the user to decide, give at most two options and recommend one.
  Write paths, commands, and names exactly — never paraphrase them.

  Delegate with the sub_agent tool when finding something would flood your context
  with material you will not need again: searching the codebase, scanning logs or
  command output, surveying many files, answering where/whether/which questions.
  Give one self-contained task per delegation and say exactly what to report back —
  findings, paths and line numbers, not file contents.
  Do it yourself instead when you already know the file, when you are about to edit
  it and need its exact text, or when one or two tool calls would settle it.

# The same prompt, kept in a file instead of inline. Use one or the other: uncommenting this
# while the text above is still active is the both-set startup error.
# system-prompt-file: ~/prompts/apogee.md

# Per-model prompts. Key an entry by the model name apogee resolves at startup (the name in the
# status footer) and it REPLACES the global prompt above for that model — whole: an entry that
# sets only system-prompt-file does not inherit the global system-prompt-text. An entry naming a
# model you are not running is simply inert: never selected, and its file is never read — so one
# config can carry a prompt per model across every machine it travels to. Each entry uses the
# same two key spellings as above.
#
# system-prompt-models:
#   qwen2.5-coder:
#     system-prompt-text: "You are apogee. Answer with code first, prose second."
#   gpt-oss-20b:
#     system-prompt-file: ~/prompts/gpt-oss.md

# =============================================================================
# Workspace context files: files apogee looks for in the WORKSPACE ROOT and folds into the
# system prompt when a session starts — the AGENTS.md / CLAUDE.md behaviour. The system prompt
# above is what YOU always want said; these are what THIS PROJECT wants said, and a repo that
# already keeps an AGENTS.md for other agents is picked up with nothing configured here.
# Config-file only (no flag or env), like the system prompt it stands beside. Defaults below.
#
# EVERY listed name that exists is included, in list order — the list is an inclusion set, not a
# priority chain — each between a `## Workspace context: <name>` header and a matching
# `## End of workspace context: <name>` footer, after the system prompt and apogee's own
# orientation block inside that same one first system message. Names are looked up in the
# workspace root ONLY: no parent-directory walk-up and no global context file (standing text that follows you
# from project to project is exactly what system-prompt-text/-file above are). A name must be a
# plain workspace-relative one: an absolute path, a name climbing out with "..", an empty entry,
# or the same name twice is a startup error naming the entry.
#
# A name that does not exist is skipped SILENTLY — the default will not exist in every repo, so
# absence is the normal case — and so is an empty file. A file that is present but cannot be
# read is skipped LOUDLY (a note in the transcript), never a startup failure: unlike
# system-prompt-file, which you named, these are discovered.
#
# The content is DATA and travels VERBATIM: the three placeholders above do NOT apply to it, so
# {{braces}} in some repo's AGENTS.md reach the model as written and can never fail apogee's
# startup.
#
# The files are read when a session STARTS and re-read by /clear, /new and a /sessions restore —
# never mid-conversation, so what the model was told stays fixed for the whole session and your
# server's prefix cache survives it. Edit AGENTS.md while apogee runs and the new text lands on
# your next /new.
#
# apogee names each file it loaded, with its size, in the transcript at every one of those
# boundaries, and warns when the standing system content (system prompt + context files) has
# outgrown its share of the context window. The warning is advisory only: nothing is ever capped
# or truncated, and with no window known yet there is no share to compare against and no warning.
#
context-files:
  enable: true             # the off-switch; default true
  names: [AGENTS.md]       # the default; looked up in the workspace root, in this order
                           # (an explicitly empty list, names: [], is the other way to say off)

# =============================================================================
# Auto's blast radius (only meaningful in --mode auto). GLOBAL-CONFIG-ONLY: there is no flag
# or env, and a project config cannot loosen it — editing THIS file is the deliberate
# acknowledgement. Default: true.
#   true   — filesystem writes are fenced to the workspace under OS confinement; the network
#            is open; MCP still asks. (The safe default.)
#   false  — "I am the sandbox": nothing is fenced and nothing asks, EXCEPT the dangerous-
#            action guard floor. Safe ONLY inside a VM/container — your responsibility. Prints
#            a warning every session.
# See also unconfined-hosts: below — the same loosen scoped to ONE machine, which the
# `/confine off --save` command records for you rather than making you edit this by hand.
# confine-to-workspace: true

# =============================================================================
# Machines you have acknowledged as disposable: on a host listed here, auto mode runs
# UNCONFINED — the same loosen as confine-to-workspace: false above, but scoped to one
# machine instead of every machine this file travels to. GLOBAL-CONFIG-ONLY, for the same
# reason as the flag (no project config, no flag, no env: nothing but this file may name
# your host). Default: EMPTY — no host is acknowledged, everything is confined.
#
# Resolution order: an explicit `confine-to-workspace: false` wins (unconfined everywhere);
# else an entry whose id matches THIS machine makes auto unconfined here; else confinement
# stays on. An id naming another machine is simply "not this host" — never an error, since
# the list is meant to accumulate. An entry with no id is skipped with a startup notice.
#
# The id is `<hostname>-<6 hex characters of a hash of the machine identifier>`; the
# `/confine` command reports this host's id, and `/confine off --save` appends the entry
# below for you (this file's comments and formatting survive the write). It is a
# safety INTERLOCK, not authentication: it stops an acknowledgement made on a throwaway
# container from silently following this file onto your laptop. It does not resist forgery,
# and it fails closed — a machine whose identifier changed is simply confined again.
#
# unconfined-hosts:
#   - id: "devbox-a1b2c3"                # this machine's host id (apogee prints it)
#     acknowledged: "2026-07-21"         # when you made the call — for your future self
#     note: "disposable container, landlock unavailable"

# =============================================================================
# Search endpoint for the web_search tool. With no endpoint set, web_search uses DuckDuckGo
# (HTML, no API key needed) — it works out of the box. Set it to `off` to disable web search,
# or point it at your own search backend, which receives the query as the `q` URL parameter
# (an HTML response is cleaned into title/url/snippet results; JSON/text passes through
# unchanged). Config-file only (no flag or env). The SSRF floor (loopback, private, and
# metadata addresses are always blocked, by resolved IP) applies regardless.
# web-search-endpoint: https://search.example.com/search

# =============================================================================
# External MCP (Model Context Protocol) servers to connect on startup. Default-EMPTY: with no
# servers listed, the MCP feature is dormant (no connections, no error). Each server's tools are
# discovered at startup and offered to the model, named "<server-name>__<tool>". Config-file only.
#
# An MCP server is an EXTERNAL, untrusted process Apogee cannot confine — so its tools ALWAYS ask
# for approval in auto mode (confine-to-workspace: true), the same as any unfenceable reach. A
# server reached over http(s) (sse / streamable-http) may live on localhost or your LAN: you named
# the address here, so it is exempt from the SSRF floor the network tools ride (that floor exists
# to stop the MODEL reaching internal addresses). The connection is PINNED to that endpoint's own
# addresses — any OTHER private address it is later pointed at is still refused — and redirects
# are not followed, so configure a redirecting server at the URL it redirects to. A stdio server
# is a local process you launch — you chose the command — so no URL check applies; its tools still
# ask in auto.
#
# mcp-servers:
#   - name: github                       # the prefix on each tool's name; must be unique
#     transport: stdio                   # stdio | sse | streamable-http
#     command: github-mcp-server         # stdio: the executable to launch
#     args: ["--stdio"]                  # stdio: optional arguments
#     env: ["GITHUB_TOKEN=…"]            # stdio: optional KEY=VALUE environment entries
#   - name: docs
#     transport: streamable-http         # sse | streamable-http: a remote http(s) server
#     endpoint: https://mcp.example.com/ # the server URL (http://127.0.0.1:… is fine too)

# =============================================================================
# The tool roster: which of Apogee's BUILT-IN tools this configuration offers the model. Almost all
# of them are on by default; list a name under disabled: and it is taken off the menu entirely — the
# model is never shown it, and a call naming it is refused as a tool that does not exist. The other
# direction is enabled:, for a tool this build leaves OFF the menu by default — present in the
# binary, offered to nobody until you name it here. Four tools ship that way today: console_open,
# console_send, console_read and console_close — the Console family, one long-lived interactive
# process (a REPL, a dev server, a shell) the model opens once and drives across several turns.
# They are off because four extra slots crowd a small model's menu; name them under enabled: and
# every model this config runs is offered them.
# Config-file only (no flag or env), and global: both lists apply to every model this config runs.
#
# It exists because a long tool list is itself a cost for a small model: fewer, clearer tools can
# beat more of them. Turn one off, run your own work against it, and keep what actually helps.
#
# The names are the ones the model calls a tool by — the same names the transcript shows while a
# tool runs (read_file, grep, terminal, web_search, …). A name that is not a tool is a startup
# NOTICE, never a refusal, and the rest of the list still applies, so a typo costs you the tool you
# meant to move and nothing else. A name written under BOTH lists is a startup NOTICE too, and
# disabled wins — the reading that takes a tool away is the one that cannot surprise you. An MCP
# server's tools are NOT listed here: they come and go with the server, so drop the server from
# mcp-servers: above instead.
#
# These are the GLOBAL lists. A single model can have a roster of its own: model-profiles: at the
# end of this file takes the same two keys, and what it says about a tool beats what this block says
# — that is how a tool stays off for the models that drown in it and on for the one that wants it.
#
# The change applies to the running session as soon as you save this file — the next request is
# built from the new roster — so /settings and a text editor behave the same way.
#
# tools:
#   disabled: [view_diff, single_find_and_replace]
#   enabled: [console_open, console_send, console_read, console_close]

# =============================================================================
# Which HOSTS the network tools (web_fetch, http_request, web_search) may reach. Both lists are
# empty by default, which means every host — subject to the SSRF floor that is always on and is not
# configurable: loopback, private, link-local and cloud-metadata addresses are refused by RESOLVED
# IP whatever these lists say. Config-file only (no flag or env), and global: it applies to every
# model this config runs.
#
# allow-hosts, when it names anything, is the whole permitted set: a URL is fetched only if its host
# equals — or is a subdomain of — an entry. deny-hosts is the opposite and wins over it, so a host on
# both is blocked. A host may be written the way you say it (Example.COM. is the same host as
# example.com), and an IPv6 address is written in brackets ([::1]); it is normalised where the guard
# is built.
#
# The lists can only ever TIGHTEN what the network tools reach — there is no spelling here that opens
# an address the floor closes. Both lists are LIVE: /settings carries them as the
# url-safety.allow-hosts and url-safety.deny-hosts rows, and committing either row — or saving this
# file — rebuilds the session's tool set around the new guard.
#
# An mcp-servers: endpoint is checked against these two lists as well: a denied host is refused with
# the same url-safety message, at startup and when a reconnect lands. What it is exempt from is the
# resolved-IP floor — that address is one you configured yourself (see above), not one the model
# chose — and the connection is pinned to that endpoint's own resolved addresses instead.
#
# url-safety:
#   allow-hosts: [docs.example.com, api.github.com]
#   deny-hosts: [ads.example.com]

# =============================================================================
# Discover skills from the workspace's bare skills/ folder, in addition to the global library
# (~/.apogee/skills) and the project's .apogee/skills (both always loaded). A skill is a folder
# containing a SKILL.md (YAML frontmatter — id/name, displayName, summary/description — plus a
# Markdown body); type its /<skill-id> in a chat message to prepend its instructions to that
# message. Config-file only (no flag or env). Default: true.
# use-project-skills: true

# =============================================================================
# Automatic context Compaction: when the conversation history outgrows its share of the model's
# context window, apogee summarises the older turns into a compact brief (the same fold the
# /compact command runs) before the next request, so a long session does not overflow the window.
# It is STRUCTURAL and load-bearing — it stays on even under --bypass — so set this to false only if
# you want to manage the window yourself with /compact. The same key also powers overflow recovery:
# when a request does not fit the window, apogee folds the history and retries the turn once instead
# of losing it, so auto-compact: false opts out of both and an overflowing turn then fails as it
# would without apogee. The on-demand /compact command works either way. Config-file only (no flag
# or env). Default: true.
auto-compact: true

# =============================================================================
# How far a delegated sub-agent may run. A sub-agent works its task in one exchange of its own, and
# nothing about that exchange is yours to watch: it reads, greps and edits until it decides it is
# done, and a model that keeps deciding otherwise can spend an unbounded number of tokens on one
# delegation. This is the ceiling, counted in TURNS — one request plus the tools it asked for —
# after which apogee ends the delegation cleanly and hands your agent what the sub-agent has so far,
# marked as partial. It bounds SUB-AGENTS only, never the session you are talking to. A sub_agent
# call may ask for a lower ceiling of its own; it can never ask for a higher one. 0 lets a
# delegation run unbounded, which is what it did before this key existed. Config-file only (no flag
# or env). Default: 80.
# delegate-max-steps: 80

# =============================================================================
# Name new sessions from their first prompt. On the first thing you say in a fresh session, apogee
# sends one small extra completion — the prompt, your workspace name and the date — and uses the
# reply as that session's title, so the session browser lists "fix the escape handling in the
# picker" instead of the first few words of what you typed. The call goes to the SAME server and
# model the session is already using; on a single-slot server it simply queues behind your first
# response and runs in the gap before your next message. It is cosmetic, never structural: it costs
# one short request per session, it never appears in the transcript or the context gauge, and if it
# fails the title apogee derived from your prompt stays. Turning it off stops only the AUTOMATIC
# naming — /rename still sets a title by hand, and bare /rename still asks the model for one.
# Config-file only (no flag or env). Default: true.
auto-title: true

# =============================================================================
# Come back on the model you were using. With this on, picking a model with /model is remembered:
# apogee writes the choice into the servers: entry the session is on — into that entry's model: key
# on an ordinary multi-model server, and into its launch-profile: key (below) on a server fronted by
# llama-launcher — so the next start binds the same model, and a launcher-fronted server has the
# profile loaded again for you when nothing is serving there yet. Only a pick YOU made is recorded:
# a model swapped under a running session (which apogee follows within ten seconds either way) is
# not, and neither are the one-shot --model / APOGEE_MODEL overrides. llama-launcher's own config is
# never written — the pointer lives here, in apogee's file. /unload-model and /stop-server leave it
# alone: they free the GPU, they do not forget what you were on. Config-file only (no flag or env).
# Default: false.
remember-model: true

# =============================================================================
# The model's context window in tokens. This one IS a pin: the ten-second heartbeat never overrides
# it, so a model switch still rebinds but the window stays exactly what you set here. Leave it unset
# to discover the window from the server, live — including when the server switches models. Set it
# only when your server does not advertise a window, or when its number is wrong for how you run it.
# It drives the Budget and the automatic compaction above: with no window known, both stay inactive
# and apogee says so in the transcript the moment it binds a model without one. Config-file only (no
# flag or env).
# context-window: 32768

# =============================================================================
# How much of that window you actually work in. A model advertising a very large window makes every
# guard that scales with it expensive at once — the budget it allocates, the tool output it lets
# through, the point it compacts at — so a single delegated task on a 1M-token model can re-send
# hundreds of thousands of tokens on every step. This key bounds the working room instead: apogee
# budgets, caps and compacts inside it, while the window above still says what the model can hold.
# On a 1M-window model, working-window: 200000 is a sane place to start. Leave it unset and the
# working room IS the advertised window, which is what apogee always did. Config-file only (no flag
# or env).
# working-window: 0
#
# The same key also lives on a servers: entry above, where it bounds the room on THAT server — one
# scope in, for the endpoint whose window dwarfs the rest. The entry's own bound wins over the key
# above wherever the session is pointed, and it follows a /server switch, a scheduled run and a
# delegation onto that server. It may not exceed that entry's own context-window: pin, which is the
# roof it sits under.
#
#   - name: big-window-cloud
#     working-window: 200000

# =============================================================================
# How much of that window is held back for the model's REPLY, as a fraction of it. apogee splits
# every request's window in two: the part the prompt may fill (your message, the history, the file
# context, the system prompt) and the part left free for the model to answer into. This key sets
# the second part. Leave it unset and apogee holds back a fifth — 0.20 — which is deliberately
# generous, because a small local model that runs out of room mid-answer loses the whole turn while
# a slightly shorter history costs it almost nothing. Raise it for a thinking model that writes
# long answers, lower it when you would rather spend the window on history and know your replies
# stay short. Config-file only (no flag or env).
#
#   (absent)  hold 0.20 of the window back — a fifth of it.
#   F         hold that share back instead; above 0 and below 1 (0.35 ⇒ a bit over a third).
#
# The value must sit strictly between 0 and 1: apogee refuses the file otherwise, because 1 or more
# would leave no room to send a prompt at all. The room this holds back is also what apogee derives
# the per-reply cap from when no max-output-tokens: is pinned below — pin that key and the cap is
# stated outright instead, while the split above stays exactly as this share says.
# response-reserve: 0.2
#
# The same key also lives on a servers: entry above, where it says how THAT server's window is
# split — one scope in, for the server that answers differently from the rest: a thinking model
# that needs room to reply, a summarizer that needs almost none. The entry's own share wins over
# the key above wherever the session is pointed, and it follows a /server switch, a scheduled run
# and a delegation onto that server:
#
#   (absent)  the top-level response-reserve: answers, and 0.20 when that is unset too.
#   F         hold that share of THIS server's window back; above 0 and below 1.
#
#   - name: workstation
#     response-reserve: 0.35

# =============================================================================
# The most tokens ONE reply may be. This one lives on a servers: entry above, beside that entry's
# own context-window: pin, because the ceiling is a property of the server's slot rather than of
# the session. Leave it unset and apogee derives the cap from the reply room the Budget already
# reserves out of the window — which is what keeps a thinking model from generating for an hour
# straight into the context wall and losing the whole turn. Set it when the derived number is wrong
# for a server: a cloud endpoint that advertises no window at all derives from an unknown one and
# takes the floor, so the pin is the only way to let such a server answer at length. A reply that
# runs into the ceiling with nothing visible in it fails the turn and says so — naming the cap and
# what the reasoning cost — so the remedy is a bigger number here or a smaller task, never a retry.
# Config-file only (no flag or env).
#
#   (absent)  derive the cap from the reply budget.
#   N         cap every reply at N tokens, whatever the window says.
#
#   - name: workstation
#     max-output-tokens: 8192

# =============================================================================
# How a finished document is shown to you. The model calls `present_document` after writing a
# deliverable (a report, a diagram, an HTML summary), and apogee decides how to surface it —
# the model never reasons about your platform. Config-file only (no flag or env).
#
# Whatever these keys say, the document's workspace-relative PATH is always printed in the
# transcript: that is the one rung that is never wrong, and most terminals (Zed, VS Code, iTerm2,
# WezTerm, kitty) make it cmd/ctrl+clickable. Above that baseline:
#
#   - running on your own desktop → apogee opens the document in the associated application
#     (HTML in your default browser). This is the `auto-open` key below. Only documents get
#     opened — reports, images, text; anything the OS would RUN rather than show (a .bat, a
#     .command, a .desktop) is left as a path in the transcript, for you to open deliberately.
#   - running over SSH (a devbox, a VM, a container) → apogee serves browser-renderable documents
#     (.html/.htm/.svg/.pdf) from a small built-in server and prints the URL beside the path, so
#     one cmd+click opens it in the browser on YOUR machine. It never auto-opens on the remote
#     box — there is no display there to open into.
#
# The built-in server hands out ONE random-token URL per presented document (no directory
# listing, no other file reachable), re-reads the file per request, starts only when a document
# is actually served, and stops when apogee exits.
#
# present:
#   auto-open: true      # open documents on a LOCAL desktop run; false = only print the path
#   command: "zed {path}"  # open with THIS application instead of the OS default ({path} = the file)
#   port: 0              # the built-in server's port; 0 (default) picks a free one per session
#   host: ""             # address the printed URL advertises; empty = detected (see below)
#
# `host` is a FALLBACK, not an override: over SSH the address you connected to this box on
# (from $SSH_CONNECTION) is used, because it is known-routable. Set `host` for topologies SSH
# cannot describe — a container behind a NAT, a VM you reach by another name.
#
# TROUBLESHOOTING an unreachable URL: on macOS Sequoia and later, the FIRST connection from a
# browser to a local-network address needs Local Network permission. Chrome fails with a generic
# "this site can't be reached" until you allow it in System Settings → Privacy & Security → Local
# Network; Safari tends to work straight away. Try the URL in Safari before suspecting apogee —
# and the path line in the transcript works regardless.

# =============================================================================
# How the terminal UI presents itself: the status-line spinner — the animation you watch while a
# turn runs — whether a scroll bar is shown, and the colour scheme the whole screen is
# drawn in. Config-file only (no flag or env).
#
# The keys are INDEPENDENT: `spinner` picks the glyph animation, `spinner-color` says whether it
# drifts through colour, and the colour loop applies to whichever style you name. `show-scrollbar`
# and `color-scheme` say nothing about either. Setting one key leaves the others at their defaults.
# Defaults: snake, with the colour loop on, the scroll bar shown, and the dark colour scheme.
#
#   snake    — a six-dot snake runs the outer ring of a 4x4 dot grid (two braille cells side by
#              side), one lap a second. Two columns wide.
#   glitter  — two braille cells re-roll twenty times a second while the number of lit dots
#              breathes in and out over six seconds, swelling to a solid ⣿⣿ and falling away
#              again. Two columns wide.
#   classic  — the single cell ⣾⣽⣻⢿⡿⣟⣯⣷ appears to rotate, ten frames a second: the spinner
#              apogee has always shown, kept as a permanent choice rather than a fallback.
#              One column wide.
#
# The colour loop is a soft ten-second lap through the active scheme's four `spinner-*` roles,
# visited in order and closing back on the first — violet → green → amber → pink under `dark` —
# blended so no step is visible. Picking another colour scheme moves the loop with it — the stops
# are the scheme's, not this file's. The lap takes ten seconds under every style. With
# `spinner-color: false` the glyph keeps your terminal's own text colour: `classic` with the loop
# off is exactly the status line apogee rendered before these styles existed, and `classic` with it
# on is those same glyphs in the new colours.
#
# CAVEAT: apogee does not detect your terminal's colour depth. On a 256-colour terminal the
# gradient steps visibly, and on a 16-colour one it collapses to a couple of tones — that is what
# `spinner-color: false` is for.
#
# `show-scrollbar` decides whether a scroll bar is painted down the right-hand edge of the
# transcript AND of every popup pane — `/settings` and its sub-lists, `/usage`, the `/sessions`
# browser, the `/model` and `/server` pickers, the `/` dropdown, the approval and ask prompts. The
# bar appears only where there is more content than window, so a pane whose rows all fit shows
# none. Turning the key off takes the bar AND the column it hangs in away together, everywhere at
# once, so the text takes that width instead — a hidden bar does not leave an empty stripe behind.
# Default on.
#
# `color-scheme` names the palette every coloured thing on the screen takes its colour from. Two
# schemes ship in the binary: `dark` (the default — the palette apogee has always drawn, apart from
# three roles retuned for legibility while the scheme system was being built: `code`, `tool-header`
# and `tool-marker`) and `light`, for a terminal with a light background. apogee never paints the
# full-screen background; a scheme recolours only what apogee already colours, so your terminal's
# own background stays.
#
# You can write your own. `/color-scheme export dark` writes a fully-commented copy to
# ~/.apogee/schemes/dark.yaml for you to edit; a file there SHADOWS a built-in of the same name, so
# exporting `dark` and editing it changes what `color-scheme: dark` loads. Any name works —
# ~/.apogee/schemes/solarized.yaml is `color-scheme: solarized`. Every key in the file is optional
# and anything you leave out keeps its default value.
#
# Loading is deliberately forgiving: an unknown scheme, an unreadable file or a key that is not a
# `#rrggbb` colour costs you a note in the transcript naming what went wrong, and the default value
# for that key — never a failed startup and never an unstyled screen. Switch schemes live from
# /settings or with `/color-scheme <name>`.
#
# `stall-after` is how long the engine may go completely silent, mid-turn, before the status line
# says so: past it the running phrase gains a bare `quiet` in front of its clock — `thinking · quiet
# · 21m 03s` — with the `· quiet` in the scheme's warning colour, and it disappears the moment the
# next event arrives. The clock stays the activity's own and there is only ever one of it. It is a
# report, never a verdict — a 43k-token prompt on a big local model is legitimately silent for a
# minute or two, and apogee cannot tell that from a server that has died, so it reports the one
# thing it does know — nothing has arrived for this long. Write it the way Go spells a duration
# (`90s`, `2m`, `1m30s`); `0` turns the qualifier off. Only a turn that claims to be thinking or
# responding is watched — a long silent tool call is normal, and a turn waiting on YOUR answer
# never counts as quiet.
#
# `inspector` arms the Inspector: apogee keeps the raw JSON it posts to the server and the raw
# stream it gets back, and `/inspect` shows you the most recent of it. That is the view for "the
# model did something strange and I want to see what was actually on the wire" — the request bodies
# and the response payloads, never your API key, which is a header and is never captured. Off by
# default, and off means off: nothing is captured, kept or emitted, so leaving this alone costs
# nothing at all. It is read once, at startup — changing it here (or from /settings) arms or disarms
# the capture at your NEXT start, not in the running session.
#
ui:
  spinner: snake         # snake | glitter | classic
  spinner-color: true    # the 10s colour loop; false = your terminal's own text colour
  show-scrollbar: true   # false = no bar in the transcript or any popup; they take back the column
  color-scheme: dark     # dark | light | any *.yaml in ~/.apogee/schemes/
  stall-after: 120s      # engine silence before "· quiet" qualifies the status line; 0 = off
  inspector: false       # true = capture the raw wire traffic /inspect shows; takes effect next start

# =============================================================================
# The prompt cursor — apogee draws the real terminal cursor, always steady, in the shape named here:
# block (the default) | underline | bar. Nothing blinks, and there is no key to make it blink. The
# shape the terminal itself is configured with cannot be inherited while apogee runs: a full-screen
# terminal program names a cursor shape on every frame, so this key is how you say which. Your
# terminal's own cursor comes back when apogee exits. Config-file only (no flag or env).
# cursor-shape: block

# =============================================================================
# The editor an external edit opens in — the ⏎ jump the /settings pane makes on a key no field can
# hold (a server list, a profile block). Write the whole command line: it is split on spaces, so
# flags travel with the program, and the file is appended as the last argument. Four rungs, in
# order: this key, then $VISUAL, then $EDITOR, then your desktop's default application for the file
# (`open` on macOS, `xdg-open` on Linux, `start` on Windows) — so leaving it unset opens this file
# in whatever already handles .yaml for you (ADR 0041). Config-file only (no flag or env).
# editor: code -w

# =============================================================================
# Run with Mechanisms off; the structural context reducers stay on (ADR 0006).
#   flag: --bypass     env: APOGEE_BYPASS
# bypass: false

# =============================================================================
# Catalogued small-model Mechanisms to enable, by canonical ID (Phase 4). Config-file only (no
# flag or env). Each Mechanism ships OFF by default — enabled only once its A/B bench run has
# proven it a win — so this block is how you opt one in. Map each ID to true to enable it; an
# unknown ID is a startup error that lists the IDs this build knows. Bypass still wins: an enabled
# non-off-ramp Mechanism does not fire under --bypass. The catalogue fills in as the port waves
# land (see docs/design/mechanism-catalogue.md); until a Mechanism's wave ships, enabling its ID
# errors.
#
# RECOMMENDED on a small context window (~32k): tool_result_cap. The automatic Compaction above
# folds only BETWEEN Exchanges — its emergency twin does fold mid-Exchange, but only once a request
# has already overflowed, which is a rescue rather than a plan (it costs a summary call and rewrites
# your history into a summary). tool_result_cap is the one reducer that SHAPES a request
# mid-Exchange, capping any single oversized tool result to its Budget share, so a doc-heavy task's
# whole-file reads stay affordable instead of leaning on that rescue.
#
# CAVEAT (ADR 0016): a non-empty mechanisms: block means manual control — a Validated set
# matching your model (see below) is then NOT auto-applied; apogee prints a one-line notice
# naming it instead. Leave this block commented out to let Validated sets apply automatically.
#
# mechanisms:
#   tool_result_cap: true       # cap any single oversized tool result — the mid-Exchange tuning valve
#   validate: true              # tool-call validation + auto-retry
#   syntax: true                # write-content syntax check
#   autofix: true               # formatter pass on tool-call payloads
#   truncate_history: false     # explicitly off (the default) — shown for reference
#   guided_decomposition: true  # oversized task → serialized sub_agent fan-out (needs tool_result_cap)

# =============================================================================
# Validated sets (ADR 0016): per-model Mechanism sets bench-proven SAFE (non-inferior to
# --bypass) on a specific model. When the model apogee resolves at startup matches an entry —
# shipped with the binary, or your own under ~/.apogee/validated/ — the set applies
# automatically at ≥ medium fingerprint confidence, and at low (name-only) confidence apogee
# prints a one-line offer instead: paste the alias it names to confirm your model IS the one
# measured. Your explicit mechanisms: block above always wins (a validated set applies whole
# or not at all), and --bypass suppresses everything. Config-file only (no flag or env).
#
# validated-sets:
#   enable: true                # the off-switch; default true
#   alias:                      # explicit carry-over: runtime model label -> entry key
#     # gemma-4-e4b-it-qat: gemma-4-e4b-it-qat     # identity = "my model is what it says"
#     # my-gemma-quant: gemma-4-e4b-it-qat         # transfer to a sibling quant (your call)

# =============================================================================
# Model profiles: how apogee equips and speaks to a model — the shape its tool calls arrive in, the
# inline thinking channel apogee strips out of what you are shown, and the tool roster this model is
# offered. The wire shape is a chat-template fact of a model family rather than a preference, and
# which tools a model can carry is a fact about the model rather than a mood, so both are keyed BY
# MODEL and re-resolved on every model change: /model, a llama-launcher profile load, a /server move,
# or the server swapping the loaded model under a running session. Config-file only (no flag or env).
#
# Most configurations never spell this key. apogee ships a built-in SHAPE TABLE of known families
# and applies it by model name, so an out-of-the-box run against one of them already reads correctly
# with this file untouched. It ships as four verified entries, matched exactly the way your own are:
#
#   gemma        delimited <think> … </think> reasoning
#   gpt-oss      harmony channels
#   minimax-m3   delimited <mm:think> … </mm:think> reasoning
#   qwen3.8      no wire shape — a ROSTER: the Console family above, enabled for this model alone
#
# A BUILT-IN match announces itself, at startup and at every switch —
# `model profile: minimax-m3 (built-in) — thinking: delimited` — because a built-in that matched the
# WRONG model is otherwise invisible and that line is the first thing to debug from. A model no
# pattern matches runs the zero profile: native tool calls, nothing stripped, exactly how apogee
# behaves without a table. Your own entries apply SILENTLY — you wrote them.
#
# A key is a PATTERN, not a name: it matches when the model apogee resolved CONTAINS it, ignoring
# case. That is what survives quants, provider prefixes and :tag suffixes — `minimax-m3` matches
# `minimax/minimax-m3:exacto` and `minimax-m3-Q4_K_M` alike. Write a family to cover a family, or the
# full advertised name to pin one build. The LONGEST matching pattern wins within a tier (equal
# lengths break alphabetically, so the winner never depends on file order), and any entry of yours
# beats every built-in — which is also how you switch a built-in off when it fires on a model it
# has no business shaping: name that model here with a thinking style of none.
#
# A matching entry is read AXIS BY AXIS, not as a whole: an axis you spell is the last word on it,
# an axis you leave out falls through to the built-in table and then to the default (native /
# nothing-stripped / no roster change). So a `tools:`-only entry for a model the table already knows
# keeps that built-in's thinking style instead of silently wiping it. Turning a built-in axis OFF is
# therefore a matter of SPELLING its off value — `tool-call-format: native`, a thinking `style: none`,
# an empty `tools:` — rather than leaving the key out. The thinking axis goes one step further and
# resolves its style and its effort INDEPENDENTLY, so an entry spelling only `effort:` keeps whatever
# channel style the built-in table carries for that model. The axes and their values:
#
#   tool-call-format   native (the default) — calls arrive structured, out of band
#                      markdown-fenced      — calls are parsed back out of a fenced block in the reply
#                      custom-regex         — calls are parsed with tool-call-pattern
#   tool-call-pattern  the named-group regex custom-regex needs — required by that format, and
#                      refused under the other two, which never read it
#   thinking:
#     style            none (the default) — no inline channel; content passes through untouched
#                      delimited          — a literal token pair: set start: and end: to what the
#                                           model ACTUALLY emits (the tokens vary per build, not
#                                           just per family)
#                      harmony            — gpt-oss channels, which need no tokens
#     effort           off | low | medium | high, plus the wider levels some servers report:
#                      minimal | xhigh | max, and none (the OpenRouter spelling of off) — how
#                      hard this model is asked to think, forwarded to the server's chat
#                      template. Absent (the default) sends nothing at all, so the model's own
#                      default stands; off asks for no reasoning. Orthogonal to style: above,
#                      which only says how the reasoning ARRIVES. A value outside that
#                      vocabulary is a startup error, and a server that rejects a level it does
#                      not offer fails the turn naming this key.
#   tools:             THIS model's tool roster — the same disabled: / enabled: pair the global
#                      tools: block above takes, written as a CHANGE to the menu rather than as a
#                      replacement for it, so a tool added by a later release reaches this model too.
#     disabled         names this model is not offered, whatever the global block says. This is how
#                      a tool that a small model drowns in stays off for it.
#     enabled          names this model IS offered, even where the global block disables them or the
#                      build leaves them off by default. This is the other half of the same story:
#                      one tool, off for the class that cannot use it, on for the model that can.
#
#                      What this block says about a tool beats what the global block says about it,
#                      per tool and in either direction. A name in both lists is a startup NOTICE and
#                      disabled wins; a name that is no tool is the same NOTICE the global lists give.
#                      MCP servers' tools are not addressable here — they ride their own surface.
#
#                      The built-in table carries one roster of its own: qwen3.8 is offered the
#                      Console family. Your own tools: for that model REPLACES it whole, the way
#                      every axis here replaces the built-in's — so `disabled: [console_open]` under
#                      a qwen3.8 entry of yours turns the whole family back off rather than trimming
#                      one tool out of it; re-list the three you still want under enabled:.
#
# `apogee probe model` prints the entry its findings suggest, keyed by the model it probed and ready
# to paste here (it never edits this file). Editing this block while a session runs swaps the parser
# on the spot, like every other key in this file.
#
# NOTE: the old GLOBAL `model-profile:` block — singular, one profile for every model — is retired. A
# config that still spells it is refused at startup, with your own block echoed back in the spelling
# below to paste.
#
# model-profiles:
#   minimax-m3:                     # matches minimax/minimax-m3:exacto, minimax-m3-Q4_K_M, …
#     thinking:
#       style: delimited
#       start: "<mm:think>"
#       end: "</mm:think>"
#       effort: medium              # leave it out entirely for the model's own default
#   my-fenced-model:
#     tool-call-format: markdown-fenced
#     thinking:
#       style: none                 # also how you switch an unwanted built-in match back off
#   my-big-model:                   # a roster of its own, for the model that can carry it
#     tools:
#       enabled: [web_search]       # on for this model, wherever the global block leaves it off
#       disabled: []                # and nothing extra taken away
