name: CI

# Phase-0 CI (docs/plans/phase-0-detail-plan.md §2). Gates formatting + vetting now,
# tests as they land (the capstone harness, P0.6). Cross-compiles the v1 platform matrix
# so the single static binary keeps building everywhere, Windows fast-follow included.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: fmt / vet / build / test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA with the release tag in the comment beside it.
      # Bump by resolving the new tag's commit — never by editing the tag comment alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: action pins (scripts/check-pins.sh)
        run: ./scripts/check-pins.sh
      - name: actionlint
        # Pinned by MODULE VERSION rather than run as a third-party action: an action would be a
        # sixth SHA to keep current and a fifth publisher trusted with this workflow's context,
        # where `go run` fetches a checksum-verified module with the toolchain already installed.
        # `make check` runs the identical command, so the two cannot drift.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (race)
        # Passes trivially until P0.6 adds the harness test; -race is on from day one
        # so the loop goroutine + EventSink observer are checked the moment they exist.
        run: go test -race ./...
      - name: probe discloses no residual on a modern kernel
        # The negative half of checklist T-11: ubuntu-latest runs landlock ABI >= 3, which fences
        # truncate(2) like every other write. A residual disclosed here is as wrong as one missing
        # on the ubuntu-22.04 job below.
        #
        # --endpoint is a raw override that skips startup-server selection: a fresh runner has no
        # config.yaml and probe never seeds one (ADR 0021 §1), so without it the command refuses
        # with "no servers are configured" before any report is gathered. The dead endpoint is
        # simply reported unreachable, which the residual check does not read.
        run: |
          report="$(go run ./cmd/apogee probe --endpoint http://127.0.0.1:9)"
          echo "$report"
          if printf '%s' "$report" | grep -q 'unfenced:'; then
            echo "probe disclosed a confinement residual on a kernel that has none" >&2
            exit 1
          fi

  landlock-abi-1-2:
    name: landlock ABI 1-2 (ubuntu-22.04)
    # Checklist T-11 steps 2, 3 and 5: the truncate(2) residual only exists on landlock ABI 1-2,
    # which is kernel 5.13 <= v < 6.2 -- ubuntu-22.04 ships 5.15, and it is the only runner image
    # GitHub offers in that window. The check job above proves the opposite direction on a modern
    # kernel. Steps 1, 4 and 6-8 of that item stay with a human or with the unit suite.
    runs-on: ubuntu-22.04
    steps:
      # Same pins as the check job -- scripts/check-pins.sh holds every one of them to a SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: kernel and landlock ABI
        # Recorded, not asserted: when the runner image moves past 6.2 this line is what says why
        # the steps below started failing, and the job needs re-homing rather than deleting.
        run: uname -r
      - name: escape battery on this ABI
        # The battery branches on the backend's own disclosure: on this kernel it REQUIRES the
        # confined truncate to succeed, and fails loudly if the backend claimed a complete fence.
        run: go test -run 'TestLandlockProbe$|TestLandlockResidualsMatchHostABI|TestLandlockCapabilitiesHonest' ./internal/platform/
      - name: probe discloses the truncate(2) residual
        # --endpoint for the same reason as the check job's probe step: no config.yaml on the
        # runner, and probe refuses rather than seeds one.
        run: |
          go run ./cmd/apogee probe --endpoint http://127.0.0.1:9 | grep -q 'unfenced: truncate(2)'
      - name: auto mode discloses the residual on startup
        # Headless is the unattended shape of the same disclosure, and it prints the notice on
        # stderr before it ever dials. The endpoint is deliberately dead: the notice is emitted
        # during composition, so the run's failure to reach a model is expected and ignored.
        run: |
          home="$(mktemp -d)"
          ws="$(mktemp -d)"
          set +e
          go run ./cmd/apogee headless --mode auto --config "$home" --workspace "$ws" \
            --endpoint http://127.0.0.1:9 'hello' >/dev/null 2>stderr.txt
          set -e
          cat stderr.txt
          grep -q 'cannot fence truncate(2)' stderr.txt

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: build all packages
        run: go build ./...
      - name: build the binary
        run: go build ./cmd/apogee
