name: CI

# Phase-0 CI (docs/plans/archived/phase-0-detail-plan.md §2). Gates formatting now,
# tests as they land (the capstone harness, P0.6). Cross-compiles the v1 platform matrix
# so the single static binary keeps building everywhere, Windows fast-follow included.
# Two further gates run as jobs of their own: `lint` (golangci-lint over the module) and
# `vulncheck` (govulncheck over the dependency graph) — the same two `make check` runs.
on:
  push:
    branches: [main]
    # A push that touches only issues, plans, reviews and other prose the build never reads
    # skips the run. `paths` rather than `paths-ignore`, because only `paths` takes `!`
    # negations: everything is in by default, each `!` line drops a tree no test, embed or
    # Makefile target reads, and a later positive line takes one file back. The filter reads
    # the whole push, so a push mixing prose and code still runs. Docs a test does read stay
    # in: README.md and VERSION, docs/manual/** and docs/design/test-drivers.md (drift tests),
    # .apogee/** (TestRepoReleaseSkillsLoad), graphics/demo/stage/** (gofmt -l . reads
    # stage's Go). A new test that reads a file dropped here must take it back below, or a
    # push touching only that file goes untested. pull_request stays unfiltered: the PRs this
    # repo gets are dependabot's, which always touch code.
    paths:
      - '**'
      - '!.capcom/**'
      # cmd/release's TestHelpNamesADecisionRecordThatExists stats this record.
      - '.capcom/knowledge/decisions/adr-0098.md'
      - '!docs/plans/**'
      - '!docs/handoffs/**'
      - '!docs/reviews/**'
      - '!docs/layout/**'
      - '!docs/adr/**'
      - '!docs/design/archived/**'
      - '!.claude/**'
      - '!.codex/**'
      - '!.vscode/**'
      - '!CHANGELOG.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - '!SECURITY.md'
      - '!LICENSE'
      - '!layout.md'
      - '!graphics/*.svg'
      - '!graphics/demo.gif'
      - '!graphics/demo/**'
      - 'graphics/demo/stage/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: fmt / build / test
    # Every Linux job names its image rather than riding ubuntu-latest, so the image's move to
    # Ubuntu 26.04 lands as a deliberate edit that a green run proves (issue ci-ubuntu-26-move),
    # not under a push that changed nothing else. The landlock steps below depend on its kernel.
    runs-on: ubuntu-26.04
    steps:
      # Actions are pinned by commit SHA with the release tag in the comment beside it.
      # Bump by resolving the new tag's commit — never by editing the tag comment alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache key of this job's own. The lint, vulncheck and cross jobs hash go.sum alone,
          # so with that default all four share one key and whichever finishes first saves it:
          # this job's race build objects were rarely the ones kept. Hashing go.mod as well gives
          # the key a value only this job produces. Never add scripts/test-shards.sh here:
          # setup-go has no restore-keys, so every edit to that script would cost a cold race build.
          cache-dependency-path: |
            go.sum
            go.mod
      - name: action pins (scripts/check-pins.sh)
        run: ./scripts/check-pins.sh
      - name: actionlint
        # Pinned by MODULE VERSION rather than run as a third-party action: an action would be a
        # sixth SHA to keep current and a fifth publisher trusted with this workflow's context,
        # where `go run` fetches a checksum-verified module with the toolchain already installed.
        # This calls the Makefile target rather than repeating the command, so the pinned version
        # literal lives once — `ACTIONLINT_VERSION` in the Makefile — and `make check` and CI
        # literally run one command.
        run: make actionlint
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go test (race, in lanes)
        # `make test` is scripts/test-shards.sh: the race-enabled suite run as a queue of
        # short-lived test processes over a fixed number of lanes, the same command `make check`
        # runs locally, so the suite has one definition (as with `make actionlint` above). The
        # lane count is sized off nproc here as on every other box: an ubuntu-26.04 runner is
        # 4 vCPU / 16 GB, so the default budget of nproc - 1 runs three race-enabled lanes and
        # leaves a core for the builds.
        run: make test
      - name: landlock UDP arm runs (row #13)
        # `make test` above counts a skipped TestLandlockProbeNetwork as a pass, so on its own it
        # cannot tell a runner that proved row #13's UDP arm from one where landlock, ABI >= 4 or
        # bash went missing. APOGEE_REQUIRE_LANDLOCK_NET=1 turns each of those skips into a
        # failure, and the grep requires the subtest's own PASS line, so an arm that ran nothing
        # cannot go green (issue apogee-ifrv). The test logs the probed landlock ABI either way.
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestLandlockProbeNetwork$' ./internal/platform/ | tee landlock-net.log
          grep -q -- '--- PASS: TestLandlockProbeNetwork/udp_egress_under_network_deny' landlock-net.log
        env:
          APOGEE_REQUIRE_LANDLOCK_NET: 1
      - name: probe discloses no write-class residual on a modern kernel
        # The negative half of checklist T-11: ubuntu-26.04 runs landlock ABI >= 3, which fences
        # truncate(2) like every other write. A truncate residual disclosed here is as wrong as one
        # missing on a 5.13-6.1 kernel. The positive half has no CI home: GitHub offers no runner in
        # that window (the ubuntu-22.04 image runs the 6.8 HWE kernel too), so it stays a manual step.
        #
        # The grep is narrowed to the truncate token on purpose: ubuntu-26.04 is also landlock ABI
        # >= 4, where every correct tree discloses the UDP and pathname-AF_UNIX egress a network-deny
        # box cannot fence. That disclosure is the fix, not the defect, so a bare 'unfenced:' grep
        # would fail every run of a correct tree.
        #
        # --endpoint is a raw override that skips startup-server selection: a fresh runner has no
        # config.yaml and probe never seeds one (ADR 0021 §1), so without it the command refuses
        # with "no servers are configured" before any report is gathered. The dead endpoint is
        # simply reported unreachable, which the residual check does not read.
        run: |
          report="$(go run ./cmd/apogee probe --endpoint http://127.0.0.1:9)"
          echo "$report"
          if printf '%s' "$report" | grep -q 'unfenced:.*truncate(2)'; then
            echo "probe disclosed a truncate(2) residual on a kernel that fences it" >&2
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # Pinned by MODULE VERSION rather than run as a third-party action, for the reasons
        # the actionlint step gives: an action would be another SHA to keep current and
        # another publisher trusted with this workflow's context, where `go run` fetches a
        # checksum-verified module with the toolchain already installed. This calls the
        # Makefile target rather than repeating the command, so the pinned version literal
        # lives once — `GOLANGCI_LINT_VERSION` in the Makefile — and `make check` and CI
        # literally run one command. A job of its own so it runs beside `check` rather than
        # behind it, and so a lint failure is named by the job that found it.
        run: make lint

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Same pinning rationale as the actionlint and golangci-lint steps: a `go run` of a
        # MODULE VERSION pinned in the Makefile (`GOVULNCHECK_VERSION`), not a third-party
        # action, and the make target rather than a second copy of the command. Unlike the
        # other two this one reaches the network for the vulnerability database, so it fails
        # loudly when the database is unreachable — that is the intended behaviour, not a
        # flake to be excused.
        run: make vulncheck

  cross:
    name: cross-compile
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build all packages
        run: go build ./...
      - name: build the binary
        run: go build ./cmd/apogee

  test-windows:
    name: windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs Go tooling only and needs no git credential.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test (race, ConPTY packages)
        # These five trees rather than `./...`: the rest of the suite is Linux-shaped (the
        # landlock battery, the PTY drivers), while the Windows half of the product is the
        # confinement backend — `internal/platform` carries `winlabel`'s walk — whose tests
        # label the runner's own disk, throwaway by construction, and the ConPTY Console in
        # `internal/console`, whose Windows-tagged tests open a pseudoconsole both
        # unconfined and confined under the restricted token. Until this job existed no
        # `//go:build windows` test had ever run: `make check` on a Linux or macOS box can
        # only compile them (`GOOS=windows go vet`).
        #
        # `internal/probe` has no Windows-tagged test today and this job claims no coverage
        # of one; the leg is here so the package's untagged tests also prove themselves on
        # the Windows toolchain, and so a future tagged test has a home.
        #
        # `internal/auditsplit` is here for the same reason: it is the shipped `/audit`
        # recipe's split, which must run on a stock Windows box and write the same parts it
        # writes on POSIX, so its untagged tests prove its path handling on the Windows
        # toolchain rather than only on Linux.
        #
        # `cmd/release` is here because a release may be cut from a Windows host: its tests
        # prove the release program's paths, archives and rendered manifests on Windows too.
        #
        # -race needs cgo, which the runner's MinGW gcc satisfies. Should it ever fail to
        # link here, drop -race from this one job and say so in this comment — the C-20
        # race test then rests on its own iteration count alone.
        #
        # The five trees run as two steps. `internal/platform` and `internal/console` are the
        # ConPTY-heavy packages: each runs 50-iteration cmd.exe/conhost loops, and run side by
        # side they share the runner's 4 vCPU and starve each other's pseudoconsoles. This
        # step runs them one at a time (`-p 1`), with `-timeout 30m` for the serial wall time.
        # The three light trees run in the next step, which carries `if: ${{ !cancelled() }}`
        # so a ConPTY failure here still reports their results in the same run.
        run: go test -race -count=1 -p 1 -timeout 30m ./internal/platform/... ./internal/console/...
      - name: go test (race, remaining trees)
        # `internal/probe`, `internal/auditsplit` and `cmd/release`: see the step above for why
        # each is here. `!cancelled()` runs this step even when the ConPTY step failed.
        if: ${{ !cancelled() }}
        run: go test -race -count=1 ./internal/probe/... ./internal/auditsplit/... ./cmd/release/...
